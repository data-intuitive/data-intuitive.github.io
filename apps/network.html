  .clickable { cursor:pointer; }
  .blk-hit { fill:transparent; stroke:none; pointer-events:all; }
  .svgbtn { cursor:pointer; }

  .pick-btn path { fill:none; stroke:#0B1D3A; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
  .popover { position:absolute; z-index:10; background:#fff; border:1px solid var(--ink); border-radius:6px; box-shadow:0 6px 24px rgba(11,29,58,0.18); padding:10px 12px; font-size:13px; min-width:220px; }

  .popover label svg { width:26px; height:18px; flex:none; }
  .popover .row { display:flex; gap:6px; margin-top:8px; }
  .popover input[type=text] { flex:1; font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:4px; }
  .popover textarea { width:100%; font:inherit; font-size:12px; line-height:1.35; padding:5px 6px; border:1px solid var(--line); border-radius:4px; resize:vertical; }
  .popover .note { margin:6px 0 0; color:#5A6890; font-size:11px; }
  .popover button { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--ink); background:#fff; border-radius:4px; cursor:pointer; }
  .popover button:hover { background:var(--bg); }

  .help { background:#fff; border-radius:10px; max-width:520px; width:calc(100% - 32px); padding:22px 26px 18px; box-shadow:0 12px 40px rgba(11,29,58,0.3); font-size:14px; line-height:1.5; }

  .help p { margin:0 0 10px; }
  .help .key { display:inline-block; border:1px solid var(--ink); border-radius:3px; padding:0 6px; font-size:11px; font-weight:700; letter-spacing:1px; }
  .help .row { display:flex; justify-content:flex-end; margin-top:6px; }
  .help button { font:inherit; font-size:12px; padding:5px 12px; border:1px solid var(--ink); background:#fff; border-radius:4px; cursor:pointer; }

<script>
(function () {
  const SVGNS = "http://www.w3.org/2000/svg";
  const BLOCKS = ["labpc", "cro", "core", "cloud", "skaldu_priv_cloud", "skaldu-3", "skaldu", "tower", "egpu", "mini1", "mini2", "seq1", "seq2", "nas", "home"];
  const SKALDUS = ["skaldu", "skaldu-3", "skaldu_priv_cloud"];   // only one can be active
  const B = {};
  let lean = false;
  const byId = id => document.getElementById(id);

  // block state, plus virtual nodes used by the line rules
  function on(id) {
    switch (id) {
      case 'cloudj':  return !B.nas && !!B.cloud;                 // no NAS: lab data goes to the private cloud
      case 'nashome': return !!B.nas && !!B.home;                 // remote users enter via the NAS VPN endpoint
      case 'trunk':   return SKALDUS.some(k => B[k]);
      default:        return !!B[id];
    }
  }
  const RULES = {
    "tunnel_cro": () => on('cro')&&on('cloud'),
    "tunnel_core": () => on('core')&&on('cloud'),
    "bundle_label": () => on('cloud')&&on('nas')&&(on('seq1')||on('seq2'))&&!(on('mini1')||on('mini2')||on('tower')),
    "nas_sync": () => on('cloud')&&on('nas'),
    "tunnel_cloud-0": () => on('home')&&on('nas'),
    "tunnel_core-3-7": () => on('cloud')&&on('nas'),
    "tunnel_cloud-0-5-8": () => on('cloudj')&&(on('mini1')||on('mini2')||on('tower')),
    "text136-8": () => on('nashome')&&on('tower'),
    "tunnel_core-4": () => on('cloudj')&&(on('seq1')||on('seq2')),
    "tunnel_core-3": () => (on('cro')||on('core'))&&on('cloud'),

    "tunnel_cloud-0-5-2": () => on('nas')&&(on('mini1')||on('mini2')||on('tower')),
    "text225-5-5": () => on('trunk')&&on('mini2'),
    "text225-5-5-0": () => on('trunk')&&on('mini1')&&!on('mini2'),
    "text225-5": () => on('trunk')&&on('tower')&&!on('mini1')&&!on('mini2'),
    "text225-5-4": () => on('labpc')&&on('trunk'),
    "tb_minis": () => on('mini1')&&on('mini2'),
    "tb_egpu": () => on('mini1')&&on('egpu'),
    "raw_h1": () => ((on('nas'))&&(on('mini2')||on('mini1')||on('tower')))||(false&&(on('cloudj'))),

    "raw_h3": () => ((on('nas'))&&(on('tower')))||((on('mini2')||on('mini1'))&&(on('cloudj'))),
    "raw_h4": () => ((on('nas')||on('cloudj'))&&(on('tower')))||((on('mini2')||on('mini1'))&&false),

    "res_d_tower": () => on('tower')&&(on('nas')||on('cloudj')),
    "user_h1": () => ((on('nashome'))&&(on('mini2')||on('mini1')||on('tower')))||(false&&false),
    "user_h2": () => ((on('nashome'))&&(on('mini1')||on('tower')))||((on('mini2'))&&false),
    "user_h3": () => ((on('nashome'))&&(on('tower')))||((on('mini2')||on('mini1'))&&false),
    "user_d_mini2": () => on('mini2')&&(on('nashome')),
    "user_d_mini1": () => on('mini1')&&(on('nashome')),
    "user_d_tower": () => on('tower')&&(on('nashome')),
    "app_h1": () => (false&&(on('mini1')||on('tower')))||((on('mini2'))&&(on('trunk'))),
    "app_h2": () => (false&&(on('tower')))||((on('mini2')||on('mini1'))&&(on('trunk'))),

    makePop(byId('btn_json'), '<h3>Description of this design</h3>' +
      '<textarea rows="5" style="width:360px;max-width:80vw" placeholder="Who is this design for, what was decided, open points…"></textarea>' +
      '<p class="note">The JSON file holds the description, the scenario, the company name, the drawing number and every setting: active parts, SKALDU, cloud provider and role, operating systems and sequencer brands.</p>' +
      '<div class="row"><button data-act="import">Import…</button><span style="flex:1"></span><button data-act="export">Export JSON</button></div>' +
      '<input type="file" accept="application/json,.json" style="display:none">', 'below');
    const ta = pop.querySelector('textarea'); ta.value = description;
    ta.addEventListener('input', () => { description = ta.value; try { localStorage.setItem('netdesign.description', description); } catch (e) {} });
    const fi = pop.querySelector('input[type=file]');
    pop.querySelector('[data-act=export]').addEventListener('click', () => { exportJson(); closePop(); });
    pop.querySelector('[data-act=import]').addEventListener('click', () => fi.click());
    fi.addEventListener('change', () => { if (fi.files[0]) importJson(fi.files[0]); });
  }
  byId('btn_json').addEventListener('click', ev => { ev.stopPropagation(); openJsonPanel(); });

  // ---- MAIL: export the current design as PDF, then open a new e-mail
  const mailSubject = () => (company ? company + ' - ' : '') + 'Multi omics data analysis setup - network design';
  const MAIL_CC = 'info@data-intuitive.com';
  const BOOK_URL = 'https://basel5--data-intuitive.netlify.app/contact/bookmeeting';
  const mailBody = () => 'Dear,\n\n' +
    'Thank you for discussing a multi omics data analysis setup with us. This PDF is the result of our discussion.\n\n' +
    'Show it to your colleagues and book a meeting with us to discuss it further and to get a price quote for this setup.\n\n' +
    'Book a meeting: ' + BOOK_URL + '\n\n' +
    'Kind regards,\n' +
    'Data Intuitive\n';
  function snapshotSvg() {
    const orig = byId('diagram'), clone = orig.cloneNode(true);
    // bake the current visibility into the copy
    const a = orig.querySelectorAll('*'), c = clone.querySelectorAll('*');
    for (let i = 0; i < a.length; i++) {
      const op = getComputedStyle(a[i]).opacity;
      if (op !== '1') c[i].setAttribute('opacity', op);
      const disp = a[i].style && a[i].style.display;
      if (disp) c[i].style.display = disp;
    }
    clone.querySelectorAll('.hit, .blk-hit, .pick-btn, #ui_buttons').forEach(e => e.remove());
    const vb = orig.viewBox.baseVal;
    clone.setAttribute('width', vb.width); clone.setAttribute('height', vb.height);
    clone.removeAttribute('style');
    return { xml: new XMLSerializer().serializeToString(clone), w: vb.width, h: vb.height };
  }
  // minimal PDF writer: one A4 landscape page with a JPEG of the drawing (no external library needed)
  function jpegToPdf(jpegBytes, imgW, imgH) {
    const PW = 841.89, PH = 595.28, m = 17;                     // A4 landscape, 6 mm margin
    const k = Math.min((PW - 2 * m) / imgW, (PH - 2 * m) / imgH);
    const w = imgW * k, hh = imgH * k, x = (PW - w) / 2, y = (PH - hh) / 2;
    const enc = new TextEncoder();
    const parts = [], offsets = []; let pos = 0;
    const push = bytes => { parts.push(bytes); pos += bytes.length; };
    const str = s => push(enc.encode(s));
    str('%PDF-1.4\n%âãÏÓ\n');
    const obj = (n, body) => { offsets[n] = pos; str(n + ' 0 obj\n' + body + '\nendobj\n'); };
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4] = pos;
    str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imgW + ' /Height ' + imgH + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>\nstream\n');
    push(jpegBytes); str('\nendstream\nendobj\n');
    const content = 'q ' + w.toFixed(2) + ' 0 0 ' + hh.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /Im0 Do Q';
    obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
    const xref = pos;
    let table = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) table += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    str(table + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
    return new Blob(parts, { type: 'application/pdf' });
  }
  async function buildPdfBlob() {
    const snap = snapshotSvg();
    const scale = 3;
    const img = new Image();
    const url = URL.createObjectURL(new Blob([snap.xml], { type: 'image/svg+xml;charset=utf-8' }));
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(snap.w * scale); canvas.height = Math.round(snap.h * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const bin = atob(dataUrl.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return jpegToPdf(bytes, canvas.width, canvas.height);
  }
  function savePdf(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileStem() + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  byId('btn_mail').addEventListener('click', async ev => {
    ev.stopPropagation();
    const btn = byId('btn_mail'); btn.classList.add('active');
    try {
      const blob = await buildPdfBlob();
      const file = new File([blob], fileStem() + '.pdf', { type: 'application/pdf' });
      // 1. share sheet with the PDF attached (Safari, Edge, Chrome on macOS/Windows): pick Mail there
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: mailSubject(), text: mailBody() });
          btn.classList.remove('active'); return;
        } catch (e) { if (e && e.name === 'AbortError') { btn.classList.remove('active'); return; } }
      }
      // 2. otherwise: save the PDF, then open a new e-mail; the PDF has to be dragged in by hand
      savePdf(blob);
      alert('The PDF has been saved to your downloads folder as ' + fileStem() + '.pdf.\n\nA new e-mail opens next, with ' + MAIL_CC + ' in copy: attach that file to it. A web page cannot add attachments to an e-mail by itself.');
      window.location.href = 'mailto:?cc=' + encodeURIComponent(MAIL_CC) + '&subject=' + encodeURIComponent(mailSubject()) + '&body=' + encodeURIComponent(mailBody());
    } catch (e) {
      alert('The PDF could not be generated in this browser. The print dialog opens instead: choose "Save as PDF", then attach that file to the e-mail.');
      window.print();
    }
    btn.classList.remove('active');
  });

  // ---- HELP
  let helpEl = null;
  function closeHelp() { if (helpEl) { helpEl.remove(); helpEl = null; } }
  function openHelp() {
    closeHelp(); closePop();
    helpEl = document.createElement('div'); helpEl.className = 'help-back';
    helpEl.innerHTML = '<div class="help">' +
      '<h2>How to use this design</h2>' +
      '<p>Click a greyed-out symbol to activate it. Click it again to switch it off. The lines between the active parts draw themselves.</p>' +
      '<p>In the sequencers, the private cloud and the workstations a small round arrow opens a menu with more detail: sequencer brands, cloud provider and its role (main data storage or backup) and operating system.</p>' +
      '<p>Some parts depend on each other: the home office needs the local storage, the eGPU needs mini workstation 1, only one SKALDU can be active, and the standard lab PC appears when no workstation is in.</p>' +
      '<p><span class="key">LEAN</span> hides the explanatory text. <span class="key">MAIL</span> makes a PDF of the current design and opens the share sheet with the PDF attached where the browser allows it; otherwise the PDF is saved to your downloads and a new e-mail opens, with info@data-intuitive.com in copy, to which you attach that file. <span class="key">JSON</span> exports every setting of the drawing, with a description and the scenario, to a file; the same panel reads such a file back in.</p>' +
      '<p>Click the title to put your company name in front of it, the drawing number to change it, and the scenario box to edit the scenario text. Company name, drawing number and description are remembered in this browser.</p>' +
      '<div class="row"><button>Close</button></div></div>';
    document.body.appendChild(helpEl);
    helpEl.addEventListener('click', ev => { if (ev.target === helpEl || ev.target.tagName === 'BUTTON') closeHelp(); });
  }
  byId('btn_help').addEventListener('click', ev => { ev.stopPropagation(); openHelp(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeHelp(); });

  // ---- popover helpers
  let pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function makePop(anchorEl, innerHTML, prefer) {
    closePop();
    const stage = document.querySelector('.stage'), sb = stage.getBoundingClientRect(), ab = anchorEl.getBoundingClientRect();
    pop = document.createElement('div'); pop.className = 'popover';
    pop.innerHTML = innerHTML;
    stage.appendChild(pop);
    // open below the button, or above it when there is no room below (bottom row of the drawing)
    const ph = pop.offsetHeight, pw = pop.offsetWidth;
    const below = prefer === 'above' ? false : (ab.bottom + 6 + ph <= window.innerHeight - 8);
    let left = ab.left - sb.left + stage.scrollLeft;
    if (ab.left + pw > window.innerWidth - 8) left = Math.max(0, left - (ab.left + pw - window.innerWidth + 8));
    pop.style.left = left + 'px';
    pop.style.top  = (below ? ab.bottom - sb.top + stage.scrollTop + 6 : ab.top - sb.top + stage.scrollTop - ph - 6) + 'px';
    pop.addEventListener('click', ev => ev.stopPropagation());
    return pop;
  }
  function addPickButton(groupId, rectId, title, onClick, up) {
    const g = byId(groupId), r = byId(rectId); if (!g || !r) return;
    const x = +r.getAttribute('x') + 9, y = +r.getAttribute('y') + +r.getAttribute('height') - 9;   // bottom-left corner
    const btn = document.createElementNS(SVGNS, 'g'); btn.setAttribute('class', 'pick-btn'); btn.setAttribute('id', 'pick_' + groupId);
    const chev = up ? 'M ' + (x - 2.4) + ',' + (y + 1.3) + ' l 2.4,-2.6 2.4,2.6' : 'M ' + (x - 2.4) + ',' + (y - 1.2) + ' l 2.4,2.6 2.4,-2.6';
    btn.innerHTML = '<circle cx="' + x + '" cy="' + y + '" r="5.5"/><path d="' + chev + '"/><title>' + title + '</title>';
    g.appendChild(btn);
    btn.addEventListener('click', ev => { ev.stopPropagation(); onClick(btn); });
  }
  document.addEventListener('click', closePop);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closePop(); });

  // ---- sequencer brand picker (CRO, core facility, lab sequencers)
  const BRANDS = ["Illumina", "Element Biosciences", "Oxford Nanopore", "PacBio", "MGI", "Ultima Genomics",
                  "Roche", "Thermo Fisher · Ion Torrent", "Singular Genomics", "Complete Genomics"];
  const PICKERS = {
    cro:  { rect: 'rect90',  slots: ['cro_l1','cro_l2','cro_l3','cro_l4'],  hide: [] },
    core: { rect: 'rect96',  slots: ['core_l1','core_l2','core_l3','core_l4'], hide: [] },
    seq1: { rect: 'rect175', slots: ['seq1_l1','seq1_l2','seq1_l3','seq1_l4','seq1_l5'], hide: ['seq1_title','seq1_sub','seq1_foot'], up: true },
    seq2: { rect: 'rect181', slots: ['seq2_l1','seq2_l2','seq2_l3','seq2_l4','seq2_l5'], hide: ['seq2_title','seq2_sub','seq2_foot'], up: true },
  };
  const selected = {};
  Object.keys(PICKERS).forEach(id => {
    const p = PICKERS[id];
    const fromSlots = p.slots.map(s => (byId(s) && byId(s).textContent.trim()) || '').filter(Boolean);
    const fromTitle = p.hide.length && byId(p.hide[0]) ? [byId(p.hide[0]).textContent.trim()] : [];
    selected[id] = fromSlots.length ? fromSlots : fromTitle;
    p.initial = selected[id].slice();
    p.custom = [];
  });
  function applyPicker(id) {
    const p = PICKERS[id], list = selected[id];
    const isInitial = list.length === p.initial.length && list.every((v, i) => v === p.initial[i]);
    const useList = !p.hide.length || !isInitial;            // lab sequencers: the list replaces the title once changed
    p.hide.forEach(t => { const el = byId(t); if (el) el.style.display = useList ? 'none' : ''; });
    p.slots.forEach((sl, i) => { const el = byId(sl); if (el) el.textContent = useList ? (list[i] || '') : ''; });
    if (useList && list.length > p.slots.length) byId(p.slots[p.slots.length - 1]).textContent = '+' + (list.length - p.slots.length + 1) + ' more';
  }
  function openBrandPicker(id, anchorEl) {
    const p = PICKERS[id];
    const all = BRANDS.concat(p.custom.filter(c => !BRANDS.includes(c)));
    makePop(anchorEl, '<h3>Sequencer brands</h3>' +
      all.map(br => '<label><input type="checkbox" value="' + br.replace(/"/g, '&quot;') + '"' + (selected[id].includes(br) ? ' checked' : '') + '> ' + br + '</label>').join('') +
      '<div class="row"><input type="text" placeholder="Other brand…"><button data-act="add">Add</button></div>' +
      '<div class="row"><button data-act="none">Clear</button><button data-act="close">Done</button></div>', p.up ? 'above' : 'below');
    const sync = () => { selected[id] = Array.from(pop.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value); applyPicker(id); };
    pop.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', sync));
    const addCustom = () => {
      const v = pop.querySelector('input[type=text]').value.trim(); if (!v) return;
      if (!p.custom.includes(v) && !BRANDS.includes(v)) p.custom.push(v);
      if (!selected[id].includes(v)) selected[id].push(v);
      applyPicker(id); openBrandPicker(id, anchorEl);
    };
    pop.querySelector('input[type=text]').addEventListener('keydown', ev => { if (ev.key === 'Enter') addCustom(); });
    pop.querySelector('[data-act=add]').addEventListener('click', addCustom);
    pop.querySelector('[data-act=none]').addEventListener('click', () => { pop.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false); sync(); });
    pop.querySelector('[data-act=close]').addEventListener('click', closePop);
  }
  Object.keys(PICKERS).forEach(id => addPickButton(id, PICKERS[id].rect, 'Choose sequencer brands', btn => openBrandPicker(id, btn), PICKERS[id].up));

  // ---- cloud provider picker (private cloud)
  const PROVIDERS = [
    { chip: 'chip_gcp',   name: 'Google Cloud', logo: 'logo_gcp',   vb: '0 0 24 24' },
    { chip: 'chip_aws',   name: 'AWS',          logo: 'logo_aws',   vb: '0 0 40 24' },
    { chip: 'chip_azure', name: 'Azure',        logo: 'logo_azure', vb: '0 0 24 24' },
    { chip: 'chip_lux',   name: 'LuxProvide',   logo: 'logo_lux',   vb: '0 0 222 65.3' },
  ];
  let provider = 'chip_gcp';
  function layoutChip(chip) {
    const g = byId(chip); if (!g) return;
    const rect = g.querySelector('rect'), logo = g.querySelector('use'), txt = g.querySelector('text');
    if (!rect || !logo) return;
    const rx = +rect.getAttribute('x'), rw = +rect.getAttribute('width'), ry = +rect.getAttribute('y'), rh = +rect.getAttribute('height');
    const lw = +logo.getAttribute('width'), lh = +logo.getAttribute('height'), gap = 9;
    logo.removeAttribute('transform');
    let tw = 0;
    if (txt) { txt.setAttribute('text-anchor', 'start'); txt.removeAttribute('transform'); try { tw = txt.getBBox().width; } catch (e) { tw = txt.textContent.length * 6.2; } }
    const total = lw + (txt ? gap + tw : 0), x0 = rx + (rw - total) / 2;
    logo.setAttribute('x', x0); logo.setAttribute('y', ry + (rh - lh) / 2);
    if (txt) { txt.setAttribute('x', x0 + lw + gap); txt.setAttribute('y', ry + rh / 2 + 4); }
  }
  function applyProvider() {
    PROVIDERS.forEach(p => { const el = byId(p.chip); if (el) { el.removeAttribute('display'); el.style.display = p.chip === provider ? '' : 'none'; } });
    layoutChip(provider);
  }
  function openProviderPicker(anchorEl) {
    makePop(anchorEl, '<h3>Private cloud provider</h3>' +
      PROVIDERS.map(p => '<label><input type="radio" name="prov" value="' + p.chip + '"' + (provider === p.chip ? ' checked' : '') + '>' +
        '<svg viewBox="' + p.vb + '" preserveAspectRatio="xMidYMid meet"><use href="#' + p.logo + '"/></svg>' + p.name + '</label>').join('') +
      '<h3 style="margin-top:10px">Role of the private cloud</h3>' +
      '<label><input type="radio" name="role" value="main"' + (cloudRole === 'main' ? ' checked' : '') + '> Main data storage</label>' +
      '<label><input type="radio" name="role" value="backup"' + (cloudRole === 'backup' ? ' checked' : '') + '> Backup' + ((B.cro || B.core) ? ' · transfer platform for third-party sequencers' : '') + '</label>' +
      (B.nas ? '' : '<p style="margin:4px 0 0;color:#5A6890;font-size:12px">Without local storage the cloud is always the main storage.</p>') +
      '<div class="row"><button data-act="close">Done</button></div>');
    pop.querySelectorAll('input[name=prov]').forEach(r => r.addEventListener('change', () => { provider = r.value; applyProvider(); }));
    pop.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => { cloudRole = r.value; render(); }));
    pop.querySelector('[data-act=close]').addEventListener('click', closePop);
  }
  addPickButton('cloud', 'cloud_rect', 'Choose cloud provider', btn => openProviderPicker(btn));

  // ---- operating system per workstation (button bottom-right, list opens upwards)
  const OSES = [ { id: 'logo_windows', name: 'Windows' }, { id: 'logo_linux', name: 'Linux' }, { id: 'logo_apple', name: 'macOS' } ];
  const OS_WS = { mini2: 'rect187', mini1: 'rect195', tower: 'rect212' };
  const osOf = { mini2: 'logo_windows', mini1: 'logo_windows', tower: 'logo_windows' };   // default: Windows
  function applyOs(w) {
    const u = byId('os_' + w); if (!u) return;
    u.setAttribute('href', '#' + osOf[w]); u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + osOf[w]);
    let t = u.querySelector('title'); if (!t) { t = document.createElementNS(SVGNS, 'title'); u.appendChild(t); }
    t.textContent = (OSES.find(o => o.id === osOf[w]) || {}).name || '';
  }
  function openOsPicker(w, anchorEl) {
    makePop(anchorEl, '<h3>Operating system</h3>' +
      OSES.map(o => '<label><input type="radio" name="os" value="' + o.id + '"' + (osOf[w] === o.id ? ' checked' : '') + '>' +
        '<svg viewBox="0 0 16 16"><use href="#' + o.id + '"/></svg>' + o.name + '</label>').join('') +
      '<div class="row"><button data-act="close">Done</button></div>', 'above');
    pop.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => { osOf[w] = r.value; applyOs(w); }));
    pop.querySelector('[data-act=close]').addEventListener('click', closePop);
  }
  Object.keys(OS_WS).forEach(w => {
    const g = byId(w), r = byId(OS_WS[w]); if (!g || !r) return;
    const x = +r.getAttribute('x') + 9, y = +r.getAttribute('y') + +r.getAttribute('height') - 9;   // bottom-left corner
    const btn = document.createElementNS(SVGNS, 'g'); btn.setAttribute('class', 'pick-btn'); btn.setAttribute('id', 'pick_os_' + w);
    btn.innerHTML = '<circle cx="' + x + '" cy="' + y + '" r="5.5"/><path d="M ' + (x - 2.4) + ',' + (y + 1.3) + ' l 2.4,-2.6 2.4,2.6"/><title>Choose operating system</title>';
    g.appendChild(btn);
    btn.addEventListener('click', ev => { ev.stopPropagation(); openOsPicker(w, btn); });
    applyOs(w);
  });
  applyProvider();

  applyCompany();
  applyDrawing();
  startState();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
})();
</script>
