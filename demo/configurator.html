<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Interactive demo: configure an omics analysis workflow — pick your assay and see the validated pipeline Data Intuitive would run on your own infrastructure." />
<meta name="robots" content="index, follow" />
<title>Platform Demo · Omics Analysis Workflow Configurator | Data Intuitive</title>
<style>
  :root {
    --p-color: #7C4BAC;
    --s-color: #00B4A0;
    --navy: #0B1D3A;
    --coral: #E05C4B;
    --text: #2F3A55;
    --text-strong: #0F1B3D;
    --text-muted: #5A6890;
    --text-soft: #7A88B5;
    --surface: #FFFFFF;
    --surface-alt: #F7F8FB;
    --surface-elev: #FAFBFD;
    --border: rgba(11, 29, 58, 0.10);
    --border-soft: rgba(11, 29, 58, 0.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --body-font: 'General Sans', 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --display-font: 'Cal Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  [data-theme="dark"] {
    --text: #C7D2E5;
    --text-strong: #FFFFFF;
    --text-muted: #94A0BC;
    --text-soft: #7A88B5;
    --surface: #14213D;
    --surface-alt: #1A2A4F;
    --surface-elev: #0F1B3D;
    --border: rgba(255, 255, 255, 0.10);
    --border-soft: rgba(255, 255, 255, 0.06);
  }
  /* No theme switch: follow the operating system, unless a host page pins
     a theme with data-theme="light". */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --text: #C7D2E5;
      --text-strong: #FFFFFF;
      --text-muted: #94A0BC;
      --text-soft: #7A88B5;
      --surface: #14213D;
      --surface-alt: #1A2A4F;
      --surface-elev: #0F1B3D;
      --border: rgba(255, 255, 255, 0.10);
      --border-soft: rgba(255, 255, 255, 0.06);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body-font);
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background: var(--surface-alt);
    min-height: 100vh;
  }
  a { color: var(--p-color); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .demo-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .demo-header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .demo-crumb {
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-soft);
    flex-shrink: 0;
  }
  .demo-crumb b { color: var(--text-strong); font-weight: 600; letter-spacing: 0.08em; text-transform: none; font-family: var(--display-font); font-size: 15px; }
  .demo-scope {
    margin: 0;
    max-width: 78ch;
    font-size: 13px; line-height: 1.5;
    color: var(--text-muted);
  }
  .demo-header-right {
    display: flex; align-items: center; gap: 14px;
  }
  .demo-pill-toggle {
    display: inline-flex; align-items: center; gap: 10px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: inherit; color: var(--text-muted);
    font-size: 12.5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .demo-pill-toggle:hover { color: var(--text-strong); border-color: var(--p-color); }
  .demo-pill-toggle .switch {
    width: 28px; height: 14px; border-radius: 999px;
    background: var(--border); position: relative;
    transition: background .15s;
  }
  .demo-pill-toggle .switch::after {
    content: ''; position: absolute; top: 1px; left: 1px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #FFFFFF;
    transition: left .15s;
  }
  .demo-pill-toggle.is-on .switch { background: var(--s-color); }
  .demo-pill-toggle.is-on .switch::after { left: 15px; }
  .demo-restart {
    background: transparent; border: 0;
    color: var(--text-muted); cursor: pointer;
    font: inherit; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .demo-restart:hover { color: var(--p-color); background: rgba(124,75,172,0.06); }

  .demo-main {
    max-width: 1280px; margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .demo-main { grid-template-columns: 1fr; gap: 20px; padding: 20px 16px 60px; }
  }

  .demo-progress {
    position: sticky; top: 76px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 22px 18px;
  }
  .demo-progress h3 {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 14px;
  }
  .demo-progress ol {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .demo-progress-step {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .demo-progress-step:hover { background: var(--surface-alt); }
  .demo-progress-step.is-future { cursor: not-allowed; opacity: 0.55; }
  .demo-progress-step.is-future:hover { background: transparent; }
  .demo-step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-family: var(--mono);
    font-size: 12px; font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: background .15s, border-color .15s, color .15s;
  }
  .demo-progress-step.is-active .demo-step-num {
    background: var(--p-color); color: #FFFFFF; border-color: var(--p-color);
  }
  .demo-progress-step.is-complete .demo-step-num {
    background: var(--s-color); color: #FFFFFF; border-color: var(--s-color);
  }
  .demo-step-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .demo-step-label {
    font-size: 13.5px; font-weight: 600;
    color: var(--text-strong);
    line-height: 1.25;
  }
  .demo-progress-step.is-future .demo-step-label { color: var(--text-soft); font-weight: 500; }
  .demo-step-summary {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.04em;
    color: var(--text-muted);
    line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .demo-content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .demo-progress { min-width: 0; }
  .step-card, .review-card, .sel-card { min-width: 0; }
  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 30px;
    transition: border-color .15s, padding .15s;
  }
  .step-card.is-collapsed {
    padding: 16px 20px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .step-card.is-collapsed:hover { border-color: var(--p-color); background: var(--surface-elev); transform: translateY(-1px); }
  .step-card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .step-card-title {
    margin: 0;
    font-family: var(--display-font);
    font-size: 22px; font-weight: 600; line-height: 1.3;
    color: var(--text-strong);
  }
  .step-card.is-collapsed .step-card-title { font-size: 15px; }
  .step-card-eyebrow {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--p-color);
    margin: 0 0 8px;
    display: block;
  }
  .step-card.is-collapsed .step-card-eyebrow { margin-bottom: 4px; font-size: 10.5px; }
  .step-card-edit {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--p-color); font-weight: 600; font-size: 12.5px;
  }
  .step-card-intro {
    font-size: 15px; color: var(--text-muted); line-height: 1.55;
    margin: 6px 0 22px;
  }

  .opt-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .opt-grid.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .opt-card {
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, transform .15s, box-shadow .15s, background .15s;
    display: flex; flex-direction: column; gap: 8px;
    font: inherit;
  }
  .opt-card:hover {
    border-color: var(--p-color);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(11,29,58,0.05);
  }
  .opt-card.is-selected {
    border-color: var(--p-color);
    background: rgba(124,75,172,0.06);
    box-shadow: 0 0 0 3px rgba(124,75,172,0.12);
  }
  .opt-card-cat {
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
  }
  .opt-card-title {
    font-family: var(--display-font);
    font-size: 16px; font-weight: 600;
    color: var(--text-strong);
    line-height: 1.3;
  }
  .opt-card-desc {
    font-size: 13.5px; color: var(--text-muted); line-height: 1.45;
    margin: 0;
  }
  .opt-card-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: auto;
  }
  .opt-card-chip {
    display: inline-flex; align-items: center;
    background: rgba(124,75,172,0.10);
    color: var(--p-color);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px; font-weight: 700;
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }
  .opt-card-chip.teal  { background: rgba(0,180,160,0.12); color: var(--s-color); }
  .opt-card-chip.amber { background: rgba(201, 162, 40, 0.16); color: #8C7218; }
  .opt-card-chip.gray  { background: var(--surface-alt); color: var(--text-soft); }

  .expr-group { margin-bottom: 22px; }
  .expr-group h4 {
    font-family: var(--mono);
    font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .expr-info-tip {
    display: inline-grid; place-items: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-size: 10px; font-weight: 700;
    cursor: help;
  }
  .expr-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .expr-pill {
    background: transparent; border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    font: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .expr-pill:hover { border-color: var(--p-color); color: var(--text-strong); }
  .expr-pill.is-selected {
    background: var(--p-color); color: #FFFFFF; border-color: var(--p-color);
  }

  .step-action {
    display: flex; justify-content: flex-end; gap: 12px;
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--border-soft);
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--p-color); color: #FFFFFF;
    border: 0; border-radius: 10px;
    padding: 12px 20px;
    font: inherit; font-size: 14.5px; font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .15s;
    text-decoration: none;
  }
  .btn-primary:hover { background: #6A3F94; color: #FFFFFF; text-decoration: none; transform: translateY(-1px); }

  .review-card {
    background: linear-gradient(135deg, rgba(0,180,160,0.05), rgba(124,75,172,0.05));
    border: 1px solid rgba(0,180,160,0.32);
    border-radius: 16px;
    padding: 30px 32px;
    margin-top: 4px;
  }
  .review-badges {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .review-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .review-badge.coverage { background: rgba(0,180,160,0.18); color: #0E8276; border: 1px solid rgba(0,180,160,0.45); }
  .review-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    padding: 18px 0;
    border-top: 1px solid rgba(11,29,58,0.08);
  }
  .review-row:first-of-type { border-top: 0; padding-top: 4px; }
  .review-label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .review-value {
    font-family: var(--display-font);
    font-size: 18px; font-weight: 600;
    color: var(--text-strong);
    line-height: 1.3;
  }
  .review-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin: 6px 0 0; }
  .review-workflow-id {
    font-family: var(--mono);
    font-size: 13.5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--p-color);
    display: inline-block;
    margin-top: 4px;
  }
  .review-callout {
    margin: 24px 0 0;
    padding: 16px 20px;
    background: rgba(0, 180, 160, 0.08);
    border: 1px solid rgba(0, 180, 160, 0.28);
    border-left: 3px solid var(--s-color);
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text);
  }
  .review-callout em {
    font-style: normal;
    color: var(--text-strong);
    font-weight: 700;
  }
  .review-cta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }
  @media (max-width: 540px) { .review-cta-row { grid-template-columns: 1fr; } }
  .review-cta-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 22px;
    border-radius: 12px;
    font-size: 15.5px; font-weight: 700;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .review-cta-btn.is-primary { background: var(--p-color); color: #FFFFFF; }
  .review-cta-btn.is-primary:hover { background: #6A3F94; color: #FFFFFF; text-decoration: none; transform: translateY(-1px); }
  .review-cta-btn.is-secondary { background: var(--s-color); color: #FFFFFF; }
  .review-cta-btn.is-secondary:hover { background: #009488; color: #FFFFFF; text-decoration: none; transform: translateY(-1px); }

  @media (max-width: 380px) {
    .demo-main, .demo-content, .demo-progress, .step-card { min-width: 0; }
    .step-card { padding: 18px 14px; }
    .demo-header { padding: 10px 12px; }
  }
  @media (max-width: 720px) {
    /* Header scrolls away instead of pinning a quarter of the screen */
    .demo-header { position: static; }
    .step-card, .review-card, .app-frame { scroll-margin-top: 12px; }
    /* Progress rail becomes a compact horizontal strip */
    .demo-progress { padding: 12px 14px 10px; }
    .demo-progress h3 { margin-bottom: 8px; }
    .demo-progress ol { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
    .demo-progress-step { flex: 0 0 auto; padding: 6px 8px; gap: 8px; align-items: center; }
    .demo-progress-divider { flex: 0 0 auto; border-top: 0; border-left: 1px solid var(--border-soft); margin: 0 2px; padding: 6px 8px; writing-mode: horizontal-tb; white-space: nowrap; align-self: center; }
    .demo-step-summary { display: none; }
    .demo-step-label { white-space: nowrap; font-size: 12.5px; }
    .demo-progress-step:not(.is-active) .demo-step-label { display: none; }
    /* Footer row */
    .step-action.split { flex-wrap: wrap; gap: 8px; }
    .step-count { display: none; }
    .step-action.split .btn-primary { flex: 1; justify-content: center; }
    .step-action .btn-primary { font-size: 13.5px; padding: 11px 14px; }
    .app-window .step-card.in-app { height: min(680px, calc(100vh - 90px)); }
    .demo-header { padding: 12px 16px; align-items: flex-start; gap: 12px; }
    .demo-scope { font-size: 12px; }
    .demo-crumb b { font-size: 14px; }
    .demo-header-right { gap: 8px; }
    .demo-pill-toggle { padding: 5px 10px; font-size: 11.5px; }
    .demo-pill-toggle .switch { display: none; }
    .step-card { padding: 22px 20px; }
    .step-card.is-collapsed { padding: 14px 16px; }
    .review-row { grid-template-columns: 1fr; gap: 12px; padding: 14px 0; }
    .review-card { padding: 22px 20px; }
    .demo-progress { position: static; }
  }

  /* ---- Pinned client window (compute step onwards) ----
     The page fills the viewport and does not scroll. The rail keeps its own
     scroll, and the client window is centred in what is left. Below 901px the
     rail stacks above the window and too little height is left, so narrow and
     short windows keep the normal scrolling layout. */
  @media (min-width: 901px) and (min-height: 560px) {
    body.is-pinned { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
    body.is-pinned .demo-main {
      flex: 1 1 auto; min-height: 0;
      padding-top: 20px; padding-bottom: 20px;
      align-items: stretch;
    }
    body.is-pinned .demo-progress { max-height: 100%; overflow-y: auto; }
    body.is-pinned .demo-content {
      height: 100%; min-height: 0; overflow: hidden;
      justify-content: center;
    }
    /* The rail already carries every earlier choice, so the summary and the
       collapsed cards make way for the step itself. */
    body.is-pinned .demo-content > .sel-card,
    body.is-pinned .demo-content > .step-card.is-collapsed { display: none; }
    /* The install step keeps its own card rather than the client window, so it
       gets the same treatment: fixed height, footer at the bottom, the stage
       scrolling inside if a short window leaves too little room. */
    body.is-pinned .demo-content > .step-card:not(.in-app):not(.is-collapsed) {
      height: 100%; max-height: 686px; min-height: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    body.is-pinned .demo-content > .step-card:not(.in-app):not(.is-collapsed) .installer-stage {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
    }
    body.is-pinned .demo-content > .step-card:not(.in-app):not(.is-collapsed) .step-action { margin-top: 12px; }
    /* The example report keeps its full preview height inside the window, so
       the three plots are shown whole rather than clipped by flex shrinking. */
    body.is-pinned .app-window .step-card.in-app .qc-example { flex: 0 0 auto; }
    /* Fixed size, so the window does not resize or move as the content of a
       step changes. 686 = the 680px card plus its label row. */
    body.is-pinned .app-frame { min-height: 0; height: 100%; max-height: 686px; }
    body.is-pinned .app-window {
      display: flex; flex-direction: column;
      min-height: 0; flex: 1 1 auto;
    }
    body.is-pinned .app-window .step-card.in-app {
      height: auto; flex: 1 1 auto; min-height: 0; max-height: none;
    }
  }

  /* Embedded mode (loaded inside a modal iframe on the platform page).
     Hides the page header so the parent page can supply its own chrome. */
  body.is-embedded .demo-header { display: none; }
  body.is-embedded .demo-main { padding-top: 20px; padding-bottom: 40px; }
  body.is-embedded .demo-progress { top: 12px; }

  /* ---- Step 1: entry point groups + availability status ---- */
  .ep-group { margin-bottom: 26px; }
  .ep-group:last-of-type { margin-bottom: 0; }
  .ep-group > h4 {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    margin: 0 0 12px;
  }
  .opt-card-chip.status-boarding { background: rgba(0,180,160,0.14); color: #0E8276; }

  /* ---- Entry points as a list ---- */
  .ep-list {
    display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: var(--surface-elev);
  }
  .ep-row {
    display: flex; align-items: center; gap: 18px;
    width: 100%; text-align: left; cursor: pointer;
    padding: 14px 18px;
    background: transparent; border: 0;
    border-left: 3px solid var(--p-color);
    border-bottom: 1px solid var(--border);
    font: inherit; color: inherit;
    transition: background .15s ease;
  }
  .ep-row:last-child { border-bottom: 0; }
  .ep-row:hover { background: var(--surface-alt); }
  .ep-row.is-selected { background: rgba(124,75,172,0.08); }
  .ep-row.is-offline {
    cursor: not-allowed; opacity: 0.55;
    border-left-color: var(--border);
  }
  .ep-row.is-offline:hover { background: transparent; }
  .ep-row-main { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
  .ep-row-title { font-family: var(--display-font); font-size: 16px; font-weight: 600; color: var(--text-strong); }
  .ep-row-desc { font-size: 13.5px; color: var(--text-soft); }
  .ep-row-status { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: 0 0 auto; }
  .ep-row-state {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #0E8276;
  }
  .ep-row.is-offline .ep-row-state { color: var(--text-soft); }
  .ep-row-note { font-family: var(--mono); font-size: 12px; color: var(--text-soft); }
  .ep-row-warn {
    display: flex; gap: 8px; margin-top: 8px;
    font-size: 12.5px; line-height: 1.45; color: #8A6516;
    background: rgba(201,162,40,0.10); border: 1px solid rgba(201,162,40,0.28);
    border-radius: 8px; padding: 7px 10px;
  }
  .ep-row-warn > span:first-child { flex: 0 0 auto; }
  @media (max-width: 520px) {
    .ep-row { gap: 12px; padding: 12px 14px; }
    .ep-row-title { font-size: 15px; }
    .ep-row-desc { font-size: 12.5px; }
    .ep-row-note { font-size: 11px; }
  }

  /* ---- Step 2/3/4: cards and rows ---- */
  .opt-grid.rows { grid-template-columns: 1fr; }
  .opt-card.kit-card { border-top: 2px solid rgba(124,75,172,0.35); }
  .opt-card-assay { font-size: 13px; font-weight: 600; color: var(--p-color); }
  .thr-bars { font-family: var(--mono); letter-spacing: 0.06em; }
  .scenario-card { gap: 6px; }
  .step-empty {
    font-size: 14px; font-style: italic;
    color: var(--text-soft);
    margin: 0;
  }

  /* ---- Step 5: experiment form ---- */
  .field-grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field-grid.is-stacked { grid-template-columns: 1fr; gap: 22px; }
  .field-with-browse { display: flex; gap: 8px; align-items: stretch; }
  .field-with-browse > input { flex: 1 1 auto; min-width: 0; }
  .browse-btn {
    flex: 0 0 auto;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 8px; padding: 0 14px;
    font: inherit; font-family: var(--body-font); font-size: 13px;
    color: var(--text-soft); cursor: not-allowed; opacity: 0.6;
  }
  .field > label {
    font-size: 13.5px; font-weight: 600; color: var(--text-strong);
  }
  .field select, .field input {
    width: 100%;
    font: inherit; font-size: 14px;
    color: var(--text-strong);
    background: var(--surface-elev);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    transition: border-color .15s;
  }
  .field select:focus, .field input:focus { outline: none; border-color: var(--p-color); }
  .field-help { font-size: 12.5px; color: var(--text-soft); line-height: 1.4; }
  .field-note {
    grid-column: 1 / -1;
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(0,180,160,0.07);
    border: 1px solid rgba(0,180,160,0.24);
    border-left: 3px solid var(--s-color);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px; line-height: 1.5; color: var(--text);
  }
  .field-note b { color: var(--text-strong); }
  .field-section-title {
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    margin: 6px 0 -4px;
  }
  .review-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  /* ---- Progress rail: path divider ---- */
  .demo-progress-divider {
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--p-color);
    padding: 12px 10px 4px;
    border-top: 1px solid var(--border-soft);
    margin-top: 6px;
  }

  /* ---- Your selection strip ---- */
  .sel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .sel-card:hover { border-color: var(--p-color); }
  .sel-label {
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    display: block; margin-bottom: 8px;
  }
  .sel-row { display: flex; flex-wrap: wrap; gap: 10px 26px; }
  .sel-pair { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sel-k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-soft); }
  .sel-v { font-size: 13.5px; font-weight: 600; color: var(--text-strong); }

  /* ---- Review: pipeline steps ---- */
  .review-row.wf-row { grid-template-columns: 1fr; }
  .wf-steps { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: wf; display: grid; gap: 6px; }
  .wf-steps li {
    counter-increment: wf;
    display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px;
    align-items: baseline;
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 8px 12px 8px 10px;
  }
  .wf-steps li::before {
    content: counter(wf);
    grid-row: 1 / span 2;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--p-color); color: #FFFFFF;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    display: grid; place-items: center; align-self: center;
  }
  .wf-step-name { font-weight: 600; font-size: 14px; color: var(--text-strong); display: flex; gap: 8px; align-items: center; }
  .wf-par { font-size: 9.5px; padding: 1px 7px; }
  .wf-step-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }
  .wf-dag { margin-top: 10px; font-style: italic; }

  /* ---- Review: path choice ---- */
  .path-title {
    font-family: var(--display-font);
    font-size: 18px; font-weight: 600; color: var(--text-strong);
    margin: 28px 0 4px;
  }
  .path-intro { font-size: 14px; color: var(--text-muted); margin: 0 0 14px; line-height: 1.5; }
  .path-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .path-grid { grid-template-columns: 1fr; } }
  .path-card { min-height: 150px; }
  .path-card .opt-card-title { font-size: 17px; }
  .path-secondary {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid rgba(11,29,58,0.08);
    font-size: 13.5px; color: var(--text-muted);
  }
  .path-secondary .review-cta-row { margin-top: 10px; }

  /* ---- Option pills (status) ---- */
  .opt-card-chip.green { background: rgba(0,180,160,0.14); color: #0E8276; }
  .opt-card-chip.slate { background: rgba(90,104,144,0.14); color: var(--text-muted); }
  .opt-card.is-disabled { opacity: 0.55; cursor: not-allowed; }
  .opt-card.is-disabled:hover { transform: none; border-color: var(--border); box-shadow: none; }
  .opt-helper { font-size: 12.5px; color: var(--text-soft); margin: 10px 0 0; line-height: 1.45; }
  .opt-card-icon { font-size: 22px; line-height: 1; margin-bottom: 2px; }

  /* ---- Prerequisite card ---- */
  .prereq-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .prereq-num {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--p-color); color: #FFFFFF;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700; font-size: 15px;
    flex-shrink: 0;
  }
  .prereq-sub { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--text-soft); margin: 0 0 20px 50px; }
  .sec-label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
    margin: 18px 0 8px;
  }
  .sec-label:first-of-type { margin-top: 0; }
  .code-block {
    position: relative;
    background: var(--surface-alt);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px 52px 14px 16px;
    font-family: var(--mono);
    font-size: 13px; line-height: 1.6;
    color: var(--text-strong);
    white-space: pre;
    overflow-x: auto;
  }
  .code-block .cmt { color: var(--text-soft); }
  /* The install commands show the shape of the work, they are not there to be
     followed line by line. They keep their colour and are blurred instead, so
     the block still reads as a terminal without inviting anyone to type it. */
  .code-block.is-faded {
    max-height: 132px; overflow: hidden;
    filter: blur(2.6px);
    user-select: none;
  }
  .code-block.is-faded .copy-btn { display: none; }
  .code-note {
    margin: 6px 0 0; font-size: 12px; color: var(--text-soft);
  }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit; font-family: var(--body-font); font-size: 11.5px;
    color: var(--text-muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color .15s, border-color .15s;
  }
  .copy-btn:hover { color: var(--p-color); border-color: var(--p-color); }
  .copy-btn.is-copied { color: #0E8276; border-color: rgba(0,180,160,0.5); }
  .prose { font-size: 14.5px; line-height: 1.6; color: var(--text); margin: 0; }
  .prose code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--surface-alt); border: 1px solid var(--border-soft);
    border-radius: 5px; padding: 1px 6px;
    color: var(--text-strong);
  }
  .check-panel {
    margin-top: 20px;
    background: rgba(124,75,172,0.07);
    border: 1px solid rgba(124,75,172,0.20);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .check-panel .sec-label { color: var(--p-color); margin-top: 0; }
  .check-panel .code-block { background: var(--surface); }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px;
    font-size: 14px; color: var(--text-strong); font-weight: 600;
    cursor: pointer;
  }
  .check-row input { width: 18px; height: 18px; accent-color: var(--s-color); cursor: pointer; }
  .demo-step-tick {
    display: inline-block; margin-left: 6px;
    color: #0E8276; font-weight: 800; font-size: 12px;
  }
  .step-action.split { justify-content: space-between; align-items: center; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 10px;
    padding: 11px 16px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  .btn-ghost:hover { color: var(--text-strong); border-color: var(--p-color); }
  .step-count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft);
  }

  /* ---- End user: download ---- */
  .demo-notice {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(201,162,40,0.10);
    border: 1px solid rgba(201,162,40,0.35);
    border-left: 3px solid #C9A228;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px; line-height: 1.5; color: var(--text);
    margin: 0 0 18px;
  }
  .demo-notice b { color: var(--text-strong); }
  .dl-card { align-items: center; text-align: center; padding: 24px 18px 20px; }
  .dl-card .opt-card-icon { font-size: 34px; margin-bottom: 6px; }
  .dl-card .opt-card-meta { justify-content: center; margin-top: 8px; }
  .dl-logo-blank { width: 1px; }
  .dl-logo { height: 48px; width: auto; max-width: 64px; object-fit: contain; margin-bottom: 8px; }
  .dl-fake-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--p-color); color: #FFFFFF;
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 700;
    margin-top: 6px;
  }
  .opt-card.is-selected .dl-fake-btn { background: var(--s-color); }

  /* ---- End user: installer illustration ---- */
  .installer-stage { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 0 0; }
  .monitor {
    width: min(620px, 100%);
    background: #1B2238;
    border: 8px solid #2C3550;
    border-radius: 16px;
    padding: clamp(9px, 1.5vh, 14px);
    box-shadow: 0 18px 40px rgba(11,29,58,0.25);
    color: #E6ECF5;
    font-family: var(--body-font);
  }
  .monitor-window {
    background: #F4F6FA; color: #1F2A44;
    border-radius: 10px; overflow: hidden;
  }
  .monitor-titlebar {
    display: flex; align-items: center; gap: 8px;
    background: #E3E7EF; padding: 8px 12px;
    font-size: 12px; font-weight: 600; color: #4A5578;
  }
  .monitor-titlebar .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .monitor-titlebar .dot.r { background: #E05C4B; } .monitor-titlebar .dot.y { background: #E8B84A; } .monitor-titlebar .dot.g { background: #3DBE7E; }
  .monitor-titlebar span.t { margin-left: 6px; }
  /* Windows: title on the left, square min / max / close controls on the right */
  .monitor-window.os-windows .monitor-titlebar { background: #FFFFFF; border-bottom: 1px solid #E1E4EA; padding: 6px 0 6px 12px; }
  .monitor-window.os-windows .monitor-titlebar span.t { margin-left: 0; flex: 1; display: inline-flex; align-items: center; gap: 8px; }
  .monitor-window.os-windows .win-icon { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #7C4BAC, #00B4A0); display: inline-block; }
  .win-controls { display: flex; }
  .win-controls span { width: 44px; height: 30px; display: grid; place-items: center; font-size: 12px; color: #1F2A44; }
  .win-controls span.close:hover { background: #E81123; color: #FFFFFF; }
  .monitor-window.os-windows .monitor-body { background: #F3F3F3; }
  .monitor-window.os-windows .inst-bar { border-radius: 0; height: 8px; }
  .monitor-window.os-windows .inst-bar > div { border-radius: 0; background: #0067C0; }
  .monitor-window.os-windows .inst-log { border-radius: 0; background: #0C0C0C; color: #CCCCCC; }
  /* Linux (GNOME-style): centred title, single round close button */
  .monitor-window.os-linux .monitor-titlebar { background: #2E3440; color: #E5E9F0; justify-content: center; position: relative; padding: 10px 12px; }
  .monitor-window.os-linux .monitor-titlebar span.t { margin-left: 0; }
  .monitor-window.os-linux .gnome-close { position: absolute; right: 10px; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: #4C566A; color: #ECEFF4; display: grid; place-items: center; font-size: 11px; }
  .monitor-window.os-linux .monitor-body { background: #ECEFF4; }
  .monitor-window.os-linux .inst-bar > div { background: #5E81AC; }
  .monitor-body { padding: clamp(9px, 1.5vh, 14px) 18px; }
  .monitor-body h4 { margin: 0 0 4px; font-family: var(--display-font); font-size: 17px; color: #0F1B3D; }
  .monitor-body p { margin: 0 0 12px; font-size: 13px; color: #5A6890; }
  .inst-bar { height: 10px; background: #DDE2EC; border-radius: 999px; overflow: hidden; }
  .inst-bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #7C4BAC, #00B4A0); border-radius: 999px; transition: width .35s linear; }
  .inst-status { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: #5A6890; margin-top: 8px; }
  .inst-log { margin-top: 8px; height: clamp(40px, 6.6vh, 58px); overflow: hidden; background: #0F1B3D; color: #B9E5DE; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; border-radius: 8px; padding: 10px 12px; height: 112px; overflow: hidden; }
  .inst-log div { white-space: nowrap; }
  .inst-done { color: #0E8276; font-weight: 700; }
  .monitor-stand { width: 90px; height: 18px; background: #2C3550; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .monitor-base { width: 200px; height: 7px; background: #2C3550; border-radius: 0 0 8px 8px; margin-bottom: 10px; }
  .keyboard {
    width: min(520px, 100%);
    background: #2C3550; border-radius: 10px;
    padding: 8px; display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 10px 24px rgba(11,29,58,0.22);
  }
  .key-row { display: flex; gap: 4px; }
  .key { flex: 1; height: clamp(7px, 1.15vh, 10px); background: #3B4666; border-radius: 3px; }
  .key.w2 { flex: 2; } .key.w6 { flex: 6; }
  .key.lit { background: #7C4BAC; box-shadow: 0 0 8px rgba(124,75,172,0.7); }

  /* ---- End user: where to run ---- */
  .warn-inline {
    display: flex; gap: 8px; align-items: flex-start;
    background: rgba(224,92,75,0.08);
    border: 1px solid rgba(224,92,75,0.28);
    border-left: 3px solid var(--coral);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12.5px; line-height: 1.45; color: var(--text);
    margin-top: 6px;
  }
  .cloud-logos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .cloud-logo {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; color: var(--text-strong);
    cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  }
  .cloud-logo:hover { border-color: var(--p-color); }
  .cloud-logo.is-selected { background: var(--p-color); border-color: var(--p-color); color: #FFFFFF; }

  /* ---- Final page blocks ---- */
  .next-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .next-block { background: var(--surface-elev); border: 1px solid var(--border); border-top: 3px solid var(--p-color); border-radius: 12px; padding: 16px 18px; }
  .next-block h3 { margin: 0 0 8px; font-family: var(--display-font); font-size: 16px; color: var(--text-strong); line-height: 1.3; }
  .next-block p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text-muted); }
  .next-block:nth-child(2) { border-top-color: var(--s-color); }
  .next-block:nth-child(3) { border-top-color: var(--navy); }

  /* ---- Desktop client frame ---- */
  .app-frame { display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 84px; }
  .step-card, .review-card { scroll-margin-top: 84px; }
  .app-frame-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-soft); padding-left: 4px; }
  .app-window { border: 6px solid #2C3550; border-radius: 14px; box-shadow: 0 14px 34px rgba(11,29,58,0.22); background: var(--surface); }
  .app-window .monitor-titlebar { border-radius: 8px 8px 0 0; }
  .app-window .step-card.in-app {
    border: 0; border-radius: 0 0 8px 8px;
    height: 680px;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .app-window .step-card.in-app > .step-action { margin-top: auto; }
  .app-window .step-card.in-app::-webkit-scrollbar { width: 10px; }
  .app-window .step-card.in-app::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .app-window .step-card.in-app .step-action { position: sticky; bottom: -28px; z-index: 2; background: var(--surface); padding-bottom: 8px; margin-bottom: -8px; }

  /* ---- Run screen ---- */
  .loc-box {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--surface-alt); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 10px 14px; margin: 0 0 16px;
  }
  .loc-pair { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .loc-pair code { font-family: var(--mono); font-size: 12.5px; color: var(--text-strong); word-break: break-all; }
  .loc-arrow { color: var(--text-soft); font-size: 16px; }
  .run-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .run-layout > * { min-width: 0; }
  .run-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .run-spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(124,75,172,0.25); border-top-color: var(--p-color);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .run-progress { flex: 1; min-width: 160px; height: 8px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; border: 1px solid var(--border-soft); }
  .run-progress > div { height: 100%; width: 0; background: var(--p-color); transition: width .4s; }
  .run-pct { font-family: var(--mono); font-size: 12px; color: var(--text-muted); min-width: 40px; text-align: right; }
  .terminal {
    background: #0F1B3D; color: #C7D2E5;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
    border-radius: 12px; padding: 16px 18px;
    height: 250px; overflow: hidden;
    position: relative;
    white-space: pre;
    overflow-x: auto;
  }
  .terminal::after {
    content: ''; position: absolute; inset: auto 0 0 0; height: 40px;
    background: linear-gradient(180deg, rgba(15,27,61,0), #0F1B3D);
  }
  .terminal.is-full { height: auto; min-height: 320px; }
  .terminal.is-full::after { display: none; }
  .terminal .cmd { color: #FFFFFF; }
  .terminal .cmd:not(.cmd2)::before { content: '$ '; color: #5EDBC8; }
  .terminal .ok { color: #5EDBC8; } .terminal .dim { color: #7A88B5; } .terminal .hl { color: #C9A9F0; }
  .run-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .run-step {
    background: var(--surface-elev); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    font-size: 12.5px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .run-step .st { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .run-step.is-running { border-color: var(--p-color); color: var(--text-strong); }
  .run-step.is-running .st { background: var(--p-color); }
  .run-step.is-done { color: var(--text-strong); }
  .run-step.is-done .st { background: var(--s-color); }

  /* ---- QC report one-pager ---- */
  .qc-report {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 28px 22px;
    margin-top: 6px;
  }
  .qc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border-soft); padding-bottom: 14px; }
  .qc-head h3 { margin: 0; font-family: var(--display-font); font-size: 21px; color: var(--text-strong); }
  .qc-head p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-muted); font-family: var(--mono); }
  .qc-verdict {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,180,160,0.14); color: #0E8276;
    border: 1px solid rgba(0,180,160,0.4);
    border-radius: 999px; padding: 6px 14px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .qc-section { margin-top: 14px; }
  .qc-section h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-soft); margin: 0 0 10px;
  }
  .qc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .qc-table th { text-align: left; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .qc-table td { white-space: nowrap; padding: 8px 8px; border-bottom: 1px solid var(--border-soft); color: var(--text); font-family: var(--mono); font-size: 12.5px; }
  .qc-table td:first-child { font-family: var(--body-font); font-weight: 600; color: var(--text-strong); }
  .qc-table-wrap { overflow-x: auto; }
  /* Two columns of statistics, so the plots below fit in the preview. */
  .qc-stats-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; align-items: start; }
  @media (max-width: 720px) { .qc-stats-2col { grid-template-columns: 1fr; } }
  .qc-flag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .qc-flag.pass { background: var(--s-color); } .qc-flag.warn { background: #C9A228; }
  .qc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .qc-panel { background: var(--surface-elev); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 14px; }
  .qc-panel h5 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .qc-panel svg { width: 100%; height: auto; display: block; }
  .qc-panel .qc-cap { font-size: 11.5px; color: var(--text-soft); margin: 6px 0 0; line-height: 1.4; }
  .qc-foot { margin-top: 18px; font-size: 12px; color: var(--text-soft); line-height: 1.5; border-top: 1px solid var(--border-soft); padding-top: 12px; }
  /* The reading text runs in two columns and the closing note sits beside the
     output paragraph, so the plots and their captions fit on the page. */
  .qc-section > .qc-cap { column-count: 2; column-gap: 26px; }
  .qc-section.qc-out { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; align-items: start; }
  .qc-section.qc-out > h4 { grid-column: 1 / -1; }
  .qc-section.qc-out > .qc-foot { margin-top: 0; border-top: 0; padding-top: 0; }
  @media (max-width: 720px) {
    .qc-section > .qc-cap { column-count: 1; }
    .qc-section.qc-out { grid-template-columns: 1fr; }
    .qc-section.qc-out > .qc-foot { margin-top: 12px; }
  }
  .qc-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }
  /* Compact, faded example report */
  .qc-example {
    position: relative;
    max-height: 480px; overflow: hidden;
    border-radius: 14px;
  }
  .qc-example .qc-report {
    padding: 16px 18px 40px;
    opacity: 0.72;
    filter: saturate(0.7);
    font-size: 12px;
  }
  .qc-example .qc-head { padding-bottom: 8px; }
  .qc-example .qc-head h3 { font-size: 16px; }
  .qc-example .qc-head p { font-size: 10.5px; }
  .qc-example .qc-verdict { font-size: 9.5px; padding: 4px 10px; }
  .qc-example .qc-section { margin-top: 10px; }
  .qc-example .qc-section h4 { font-size: 9.5px; margin-bottom: 6px; }
  .qc-example .qc-table th { font-size: 9px; padding: 4px 6px; }
  .qc-example .qc-table td { font-size: 10.5px; padding: 4px 6px; }
  .qc-example .qc-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .qc-example .qc-panel { padding: 8px 10px; }
  .qc-example .qc-panel h5 { font-size: 11px; margin-bottom: 4px; }
  .qc-example .qc-panel .qc-cap, .qc-example .qc-cap { font-size: 9.5px !important; margin-top: 3px !important; }
  .qc-example .qc-legend { font-size: 9.5px; margin-top: 3px; }
  .qc-example .prose { font-size: 11.5px !important; }
  .qc-example .qc-foot { font-size: 10px; margin-top: 8px; padding-top: 6px; }
  .qc-example::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 140px;
    background: linear-gradient(180deg, rgba(255,255,255,0), var(--surface));
    pointer-events: none;
  }
  .qc-example-stamp {
    position: absolute; top: 12px; right: 14px; z-index: 2;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text-soft); border: 1.5px dashed var(--border); border-radius: 6px;
    padding: 4px 10px; background: var(--surface); transform: rotate(-4deg);
  }
  .qc-example-note { font-size: 12.5px; color: var(--text-soft); margin: 6px 0 0; font-style: italic; }
  .qc-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--lg); }

  function stepCompleteness(i) {
    if (i === 0) return !!state.entry;
    if (i === 1) return !!state.kit;

    if (i === 3) return scenarioStepSatisfied();
    if (i === 4) return experimentStepSatisfied();
    if (i === REVIEW_IDX) return !!state.reviewed;
    if (i === SIM_IDX)    return !!state.path;

    if (!step) return false;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);

      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){

    var list = document.getElementById('progressList');

    var steps = allSteps();
    steps.forEach(function(step, i){
      var li = document.createElement('li');
      li.className = 'demo-progress-step';
      if (i === state.activeStep) li.classList.add('is-active');
      if (stepCompleteness(i) && i < state.activeStep) li.classList.add('is-complete');
      if (i > max) li.classList.add('is-future');

      var summary = stepSummary(i);
      if (i >= state.activeStep && i !== REVIEW_IDX && i !== SIM_IDX) summary = (i === state.activeStep ? summary : '');

      // Path header: a small divider label before the first path step
      if (i === SIM_IDX + 1) {
        var pathName = (findIn(PATHS, state.path) || {}).name || '';
        list.appendChild(el('li', { class: 'demo-progress-divider' }, [pathName]));
      }

      var checked = step.prereq && state.prereqChecked[state.backend + ':' + step.idx];
      li.appendChild(el('div', { class: 'demo-step-num' }, [String(i + 1)]));
      li.appendChild(el('div', { class: 'demo-step-text' }, [

  function stepSummary(i) {
    var kit = currentKit();
    if (i === 0 && state.entry) return entryById(state.entry).name;
    if (i === 1 && kit) return kit.name;
    if (i === 2 && state.instrument) return (INSTRUMENTS[state.instrument] || {}).name || '';
    if (i === 3 && kit) {
      if (!scenariosFor(kit).length) return 'No scenarios for this assay';
      return state.scenario ? (findIn(scenariosFor(kit), state.scenario) || {}).name || '' : '';
    }
    if (i === 4 && kit && experimentStepSatisfied()) {
      return optLabel(SPECIES, state.exp.species) + ' \u00B7 ' + optLabel(INPUT_SHAPES, state.exp.input_shape);
    }
    if (i === REVIEW_IDX && stepCompleteness(4)) {
      var wf = WORKFLOWS[state.scenario];
      return wf ? wf.id : (kit ? (kit.software || '') : '');
    }
    if (i === SIM_IDX) return state.path ? (findIn(PATHS, state.path) || {}).name || '' : '';
    var step = stepAt(i);
    if (!step) return '';
    if (step.id === 'backend' && state.backend)   return (findIn(BACKENDS, state.backend) || {}).name || '';
    if (step.prereq) {
      var key = state.backend + ':' + step.idx;

    if (step.id === 'where' && state.runTarget)   return (findIn(RUN_TARGETS, state.runTarget) || {}).name;

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  function fieldNode(f, onDirty) {
    if (f.type === 'note') {
      return el('div', { class: 'field-note' }, [
        el('span', null, [el('b', null, [f.label + ': ']), f.note])
      ]);
    }

    var input;
    if (f.type === 'select') {
      input = el('select', { id: 'f-' + f.id });
      f.options.forEach(function(o){
        var opt = el('option', { value: o.id }, [o.name]);
        if (state.exp[f.id] === o.id) opt.selected = true;
        input.appendChild(opt);
      });
      input.addEventListener('change', function(){
        state.exp[f.id] = input.value;
        render();                       // reference_mode toggles other fields
      });
    } else {
      input = el('input', {
        id: 'f-' + f.id,
        type: f.type === 'integer' ? 'number' : 'text',
        value: state.exp[f.id] == null ? '' : String(state.exp[f.id])
      });
      if (f.type === 'integer') input.setAttribute('min', '1');
      if (f.placeholder) input.setAttribute('placeholder', f.placeholder);
      input.addEventListener('input', function(){
        if (f.type === 'integer') {
          state.exp[f.id] = input.value === '' ? '' : Number(input.value);
        } else {
          state.exp[f.id] = input.value;
        }
        onDirty();
      });
    }

    var control = input;
    if (f.type === 'file') {
      // A browse button, greyed: this is a mockup, there is no file system here.
      var browse = el('button', { class: 'browse-btn', type: 'button', title: 'Not available in the demo' }, ['Browse\u2026']);
      browse.disabled = true;
      control = el('div', { class: 'field-with-browse' }, [input, browse]);
    }

    return el('div', { class: 'field' }, [
      el('label', { for: 'f-' + f.id }, [f.label]),
      control,
      f.help ? el('span', { class: 'field-help' }, [f.help]) : null
    ]);
  }

  }

  function copyButton(text) {
    var btn = el('button', { class: 'copy-btn', type: 'button', title: 'Copy to clipboard' }, ['⧉ Copy']);
    btn.addEventListener('click', function(){
      function done() { btn.textContent = '✓ Copied'; btn.classList.add('is-copied');
        setTimeout(function(){ btn.textContent = '⧉ Copy'; btn.classList.remove('is-copied'); }, 1400); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
        ta.select(); try { document.execCommand('copy'); } catch(_){} document.body.removeChild(ta); done();
      }
    });
    return btn;
  }
  function codeBlock(code, faded) {
    var block = el('div', { class: 'code-block' + (faded ? ' is-faded' : '') });
    code.split('\n').forEach(function(line, i){
      if (i) block.appendChild(document.createTextNode('\n'));
      var hash = line.indexOf('#');
      if (hash >= 0) {
        block.appendChild(document.createTextNode(line.slice(0, hash)));
        block.appendChild(el('span', { class: 'cmt' }, [line.slice(hash)]));
      } else {
        block.appendChild(document.createTextNode(line));
      }
    });
    block.appendChild(copyButton(code));
    return block;
  }
  // Minimal markdown: `code` and [text](url).
  function prose(md) {
    var p = el('p', { class: 'prose' });
    var re = /`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g, last = 0, m;
    while ((m = re.exec(md))) {
      if (m.index > last) p.appendChild(document.createTextNode(md.slice(last, m.index)));
      if (m[1]) p.appendChild(el('code', null, [m[1]]));
      else p.appendChild(el('a', { href: m[3], target: '_blank', rel: 'noopener' }, [m[2]]));
      last = re.lastIndex;
    }
    if (last < md.length) p.appendChild(document.createTextNode(md.slice(last)));
    return p;
  }

  function pad(str, n) { while (str.length < n) str += ' '; return str; }
  function runPlan(wf) {
    var n = wf.perSample ? 1 : QC_SAMPLES.length;
    var log = [];
    if (state.path === 'bioinf') {
      log.push(['dim', '# params.yaml was generated from your wizard answers. Source and target are in it, just run.']);
      log.push(['cmd', 'cat params.yaml']);
      log.push(['', 'input: ' + sourcePath()]);
      log.push(['', 'publish_dir: ' + targetPath()]);
      log.push(['', 'reference: ' + (state.exp.reference_mode === 'own' ? firstOf(fieldValue(fieldById('reference_path'))) : (state.exp.reference_mode === 'generate' ? 'build from ' + firstOf(fieldValue(fieldById('genome_fasta'))) : optLabel(SPECIES, state.exp.species)))]);
      if (state.entry === 'single_cell') log.push(['', 'expect_cells: ' + fieldValue(fieldById('expect_cells'))]);
      log.push(['dim', '']);
      log.push(['cmd', 'nextflow run ' + wf.id + (wf.version ? ' -r ' + wf.version : '') + ' -profile ' + (state.backend === 'hpc' ? 'singularity' : 'docker') + ' -params-file params.yaml']);
      log.push(['dim', '']);
    }
    log.push(
      ['dim', 'N E X T F L O W  ~  version 24.10.4'],
      ['hl',  'Launching `' + wf.id + '`' + (wf.version ? ' [' + wf.version + ']' : '') + ' ...'],
      ['',    'executor >  {EXEC} (' + n + ')']
    );
    var width = 30;
    wf.steps.forEach(function(st, i){
      var h = '[' + HASHES[i % HASHES.length] + '] ';
      var isRef = st.kind === 'ref';
      var count = isRef || st.proc.indexOf('report') === 0 ? 1 : n;
      var skip = (st.kind === 'demux' && state.exp.input_shape === 'fastq')
              || (isRef && state.exp.reference_mode !== 'generate');
      if (skip) {
        log.push(['dim', h + pad(st.proc, width) + '[100%] ' + count + ' of ' + count + ' ✔  (no work: ' + (isRef ? 'reference provided' : 'FASTQ provided') + ')']);
        return;
      }
      if (count > 1) {
        // Same key as the finished line below: Nextflow rewrites the line in
        // place rather than printing a second one.
        log.push(['', h + pad(st.proc, width) + '[  0%] 0 of ' + count, 'proc' + i]);
        if (st.kind === 'count') {
          QC_SAMPLES.forEach(function(sm){ log.push(['dim', '  ' + pad(sm.id, 24) + 'reads ' + sm.reads.toFixed(1) + 'M  expect-cells ' + fieldValue(fieldById('expect_cells'))]); });
        }
      }
      log.push(['', h + pad(st.proc, width) + '[100%] ' + count + ' of ' + count + ' ✔', 'proc' + i]);
    });
    var total = 0;
    wf.steps.forEach(function(st){ total += (st.kind === 'ref' || st.proc.indexOf('report') === 0) ? 1 : n; });
    log.push(['ok', 'Completed at: {DATE}   Duration: ' + (wf.perSample ? '0h 38m 05s' : '1h 42m 11s') + '   Succeeded: ' + total]);
    log.push(['ok', wf.perSample ? 'Report written to ' + targetPath() + '/multiqc_report.html' : 'Written ' + targetPath() + '/<sample>.h5mu and <sample>/outs/web_summary.html']);
    return { stages: wf.steps.map(function(st){ return st.name; }), log: log };
  }

    var statusText = el('span', null, ['Running ' + wfLabel(WORKFLOWS[state.scenario]) + ' on ' + whereText]);
    var wf = WORKFLOWS[state.scenario] || WORKFLOWS['transcriptomics.single_cell.count_only'];
    var plan = runPlan(wf);
    var RUN_STAGES = plan.stages, RUN_LOG = plan.log;
    var stages = RUN_STAGES.map(function(s){ return el('div', { class: 'run-step' }, [el('span', { class: 'st' }), s]); });

    function finish() {
      clearInterval(runTimer); runTimer = null;
      progress = 100; paint();
      spinner.style.display = 'none';
      statusText.textContent = 'Run finished. ' + (wf.perSample ? 'MultiQC report ready.' : 'Count QC report ready.');
      stages.forEach(function(s){ s.className = 'run-step is-done'; });
      skipBtn.style.display = 'none';
      state.runDone = true;
      nextBtn.disabled = false; nextBtn.style.opacity = ''; nextBtn.style.cursor = '';
      renderProgress();
    }
    skipBtn.addEventListener('click', function(){
      while (li < RUN_LOG.length) { appendLine(RUN_LOG[li]); li++; }
      finish();
    });
    var lineByKey = {};
    function appendLine(entry) {
      var text = entry[1].replace('{EXEC}', execName).replace('{DATE}', new Date().toISOString().slice(0, 16).replace('T', ' '));
      var cls = entry[0] === 'cmd2' ? 'cmd cmd2' : entry[0];
      var key = entry[2];
      if (key && lineByKey[key] && lineByKey[key].parentNode === term) {
        lineByKey[key].textContent = text;      // the process line updates in place
        lineByKey[key].className = cls;
        return;
      }
      var node = el('div', { class: cls }, [text]);
      term.appendChild(node);
      if (key) lineByKey[key] = node;
      if (!isBioinf) while (term.children.length > 12) term.removeChild(term.firstChild);
    }
    if (state.runDone) {
      RUN_LOG.forEach(appendLine);
      stages.forEach(function(s){ s.className = 'run-step is-done'; });
      finish();
    } else {
      runTimer = setInterval(function(){
        if (li < RUN_LOG.length) { appendLine(RUN_LOG[li]); li++; }
        progress = Math.min(100, Math.round(li / RUN_LOG.length * 100));
        paint();
        var stageIdx = Math.min(RUN_STAGES.length - 1, Math.floor(li / RUN_LOG.length * RUN_STAGES.length));

        });

      var other = s.genome - s.transcriptome - s.intronic - s.intergenic;
      [[s.transcriptome, '#7C4BAC'], [s.intronic, '#00B4A0'], [s.intergenic, '#C9A228'], [Math.max(0, other), 'rgba(120,130,160,0.55)'], [unmapped, 'rgba(120,130,160,0.25)']].forEach(function(seg){
        var w = (W - 8) * seg[0] / 100;
        svg.appendChild(svgEl('rect', { x: x, y: y, width: Math.max(0, w - 1), height: rowH - 10, rx: 2, fill: seg[1] }));
        x += w;
      });
      svg.appendChild(svgEl('text', { x: padL + 4, y: y + 12, 'font-size': '9', fill: '#FFFFFF', 'font-weight': '700' }, [s.id.split('/').pop() + '  ' + s.transcriptome.toFixed(1) + '%']));
    });
    return svg;
  }
  // Barcode rank plot (log-log): UMI counts per barcode, the CellRanger knee plot.
  function qcBarcodeRankChart() {
    var W = 320, H = 150, padL = 34, padB = 24, padT = 8;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Barcode rank plot per sample' });
    var plotH = H - padB - padT, plotW = W - padL - 8;
    var xMax = 6, yMax = 5;   // log10 barcodes, log10 UMIs
    for (var e = 0; e <= xMax; e += 2) {
      var gx = padL + plotW * e / xMax;
      svg.appendChild(svgEl('line', { x1: gx, x2: gx, y1: padT, y2: padT + plotH, stroke: 'currentColor', 'stroke-opacity': '0.12' }));
      svg.appendChild(svgEl('text', { x: gx, y: H - 10, 'text-anchor': 'middle', 'font-size': '9', fill: 'currentColor', 'fill-opacity': '0.6' }, ['1e' + e]));
    }
    for (var f = 0; f <= yMax; f += 1) {
      var gy = padT + plotH - plotH * f / yMax;
      svg.appendChild(svgEl('line', { x1: padL, x2: W - 8, y1: gy, y2: gy, stroke: 'currentColor', 'stroke-opacity': '0.12' }));
      if (f % 2 === 1) svg.appendChild(svgEl('text', { x: padL - 5, y: gy + 3, 'text-anchor': 'end', 'font-size': '9', fill: 'currentColor', 'fill-opacity': '0.6' }, ['1e' + f]));
    }
    QC_SAMPLES.forEach(function(s, si){
      var pts = [];
      var kneeX = Math.log10(s.cells), top = Math.log10(s.medUMI * 2.2), floor = 0.2;
      for (var i = 0; i <= 60; i++) {
        var lx = xMax * i / 60;
        var ly;
        if (lx < kneeX) ly = top - 0.25 * lx / kneeX;
        else if (lx < kneeX + 0.5) ly = (top - 0.25) - (top - 0.25 - 1.4) * (lx - kneeX) / 0.5;
        else ly = Math.max(floor, 1.4 - (lx - kneeX - 0.5) * 0.5);
        pts.push((padL + plotW * lx / xMax).toFixed(1) + ',' + (padT + plotH - plotH * ly / yMax).toFixed(1));
      }
      svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: QC_COLORS[si], 'stroke-width': '2' }));
    });
    svg.appendChild(svgEl('text', { x: padL + plotW / 2, y: H - 1, 'text-anchor': 'middle', 'font-size': '9', fill: 'currentColor', 'fill-opacity': '0.75' }, ['Barcodes (rank)']));
    return svg;
  }
  // Saturation curves: reads (x) vs saturation (y).
  function qcSaturationChart() {
    var W = 320, H = 150, padL = 30, padB = 26, padT = 8;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Sequencing saturation per sample' });
    var plotH = H - padB - padT, plotW = W - padL - 8;
    [0, 0.25, 0.5, 0.75, 1].forEach(function(v){
      var y = padT + plotH - plotH * v;
      svg.appendChild(svgEl('line', { x1: padL, x2: W - 8, y1: y, y2: y, stroke: 'currentColor', 'stroke-opacity': '0.12' }));
      svg.appendChild(svgEl('text', { x: padL - 6, y: y + 3, 'text-anchor': 'end', 'font-size': '9', fill: 'currentColor', 'fill-opacity': '0.6' }, [Math.round(v * 100) + '%']));
    });
    QC_SAMPLES.forEach(function(s, si){
      var pts = [];
      for (var i = 0; i <= 20; i++) {
        var frac = i / 20;                           // fraction of reads subsampled
        var sat = s.sat * (1 - Math.exp(-3.2 * frac)) / (1 - Math.exp(-3.2));
        pts.push((padL + plotW * frac).toFixed(1) + ',' + (padT + plotH - plotH * sat).toFixed(1));
      }
      svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: QC_COLORS[si], 'stroke-width': '2' }));
    });
    svg.appendChild(svgEl('line', { x1: padL, x2: W - 8, y1: padT + plotH * 0.5, y2: padT + plotH * 0.5, stroke: '#E05C4B', 'stroke-dasharray': '3 3', 'stroke-opacity': '0.7' }));
    svg.appendChild(svgEl('text', { x: W / 2 + 10, y: H - 8, 'text-anchor': 'middle', 'font-size': '10', fill: 'currentColor', 'fill-opacity': '0.75' }, ['Input reads (subsampled)']));
    return svg;
  }
  // MultiQC-style one pager for the per-sample bulk workflow.
  function bulkStackedBar(segs, label) {
    var W = 320, H = 34;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': label });
    var x = 0;
    segs.forEach(function(sg){
      var w = W * sg[0] / 100;
      svg.appendChild(svgEl('rect', { x: x, y: 4, width: Math.max(0, w - 1), height: 22, rx: 2, fill: sg[1] }));
      if (w > 34) svg.appendChild(svgEl('text', { x: x + 5, y: 19, 'font-size': '9', fill: '#FFFFFF', 'font-weight': '700' }, [sg[0].toFixed(1) + '%']));
      x += w;
    });
    return svg;
  }
  function fastqcQualityChart() {
    var W = 320, H = 130, padL = 26, padB = 20, padT = 6;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Mean per-base quality, raw versus trimmed' });
    var plotH = H - padB - padT, plotW = W - padL - 6;
    [[0, 20, 'rgba(224,92,75,0.10)'], [20, 28, 'rgba(201,162,40,0.12)'], [28, 40, 'rgba(0,180,160,0.10)']].forEach(function(b){
      svg.appendChild(svgEl('rect', { x: padL, y: padT + plotH - plotH * b[1] / 40, width: plotW, height: plotH * (b[1] - b[0]) / 40, fill: b[2] }));
    });
    [0, 20, 40].forEach(function(v){
      svg.appendChild(svgEl('text', { x: padL - 5, y: padT + plotH - plotH * v / 40 + 3, 'text-anchor': 'end', 'font-size': '9', fill: 'currentColor', 'fill-opacity': '0.6' }, [String(v)]));
    });
    [['#7A88B5', function(i){ return 36 - Math.max(0, (i - 60)) * 0.14 - (i < 4 ? 3 : 0); }],
     ['#7C4BAC', function(i){ return 36.5 - Math.max(0, (i - 60)) * 0.06 - (i < 4 ? 2 : 0); }]].forEach(function(series){
      var pts = [];
      for (var i = 0; i <= 150; i += 5) {
        pts.push((padL + plotW * i / 150).toFixed(1) + ',' + (padT + plotH - plotH * series[1](i) / 40).toFixed(1));
      }
      svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: series[0], 'stroke-width': '2' }));
    });
    svg.appendChild(svgEl('text', { x: padL + plotW / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': '10', fill: 'currentColor', 'fill-opacity': '0.75' }, ['Position in read (bp)']));
    return svg;
  }
  function renderBulkReport() {
    var wf = WORKFLOWS[state.scenario] || {};
    var inst = INSTRUMENTS[state.instrument] || {};
    var kit = currentKit() || {};
    var dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    var rows = [
      ['Sample', 'sample_01 (R1 + R2)'],
      ['Raw reads', '42.6M pairs'],
      ['After TrimGalore', '41.9M pairs (98.4% kept) · adapters found in 12.1% of reads'],
      ['FastQC', 'raw: 1 warning (adapter content) · trimmed: all pass'],
      ['Kallisto pseudo-aligned', '86.3%'],
      ['STAR uniquely mapped', '89.7% · multi-mapped 6.1% · unmapped 4.2%'],
      ['Salmon mapping rate', '91.4% (alignment mode)'],
      ['Qualimap', 'exonic 78.2% · intronic 16.9% · intergenic 4.9% · 5\u2032 to 3\u2032 bias 1.04'],
      ['Genes detected', '18 940 (TPM > 1)']
    ];
    function statTable(list) {
      var body = el('tbody');
      list.forEach(function(r){
        body.appendChild(el('tr', null, [
          el('td', null, [r[0]]),
          el('td', { style: 'white-space:normal' }, [r[1]])
        ]));
      });
      return el('table', { class: 'qc-table' }, [body]);
    }
    var half = Math.ceil(rows.length / 2);
    return el('div', { class: 'qc-report' }, [
      el('div', { class: 'qc-head' }, [
        el('div', null, [
          el('h3', null, ['MultiQC Report']),
          el('p', null, [dateStr + ' · ' + wfLabel(wf) + ' · ' + (kit.name || '') + ' · ' + (inst.name || '')])
        ]),
        el('span', { class: 'qc-verdict' }, ['✓ 1 sample · all checks pass'])
      ]),
      el('div', { class: 'qc-section' }, [
        el('h4', null, ['1 · General statistics']),
        el('div', { class: 'qc-stats-2col' }, [
          el('div', { class: 'qc-table-wrap' }, [statTable(rows.slice(0, half))]),
          el('div', { class: 'qc-table-wrap' }, [statTable(rows.slice(half))])
        ])
      ]),
      el('div', { class: 'qc-section' }, [
        el('h4', null, ['2 · Alignment and QC']),
        el('div', { class: 'qc-grid' }, [
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['STAR alignment scores']),
            bulkStackedBar([[89.7, '#7C4BAC'], [6.1, '#00B4A0'], [4.2, 'rgba(120,130,160,0.35)']], 'STAR alignment'),
            el('p', { class: 'qc-cap' }, ['Uniquely mapped (purple), multi-mapped (teal), unmapped (grey).'])
          ]),
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['Qualimap genomic origin']),
            bulkStackedBar([[78.2, '#7C4BAC'], [16.9, '#C9A228'], [4.9, 'rgba(120,130,160,0.35)']], 'Genomic origin'),
            el('p', { class: 'qc-cap' }, ['Exonic (purple), intronic (amber), intergenic (grey). Coordinate-based, from the STAR BAM.'])
          ]),
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['FastQC mean quality, raw vs trimmed']),
            fastqcQualityChart(),
            el('p', { class: 'qc-cap' }, ['Phred score per position. Grey: raw. Purple: after TrimGalore. The 3\u2032 drop is removed by trimming.'])
          ]),
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['Kallisto vs Salmon']),
            bulkStackedBar([[86.3, '#00B4A0'], [13.7, 'rgba(120,130,160,0.2)']], 'Kallisto pseudo-alignment rate'),
            bulkStackedBar([[91.4, '#7C4BAC'], [8.6, 'rgba(120,130,160,0.2)']], 'Salmon mapping rate'),
            el('p', { class: 'qc-cap' }, ['Top: Kallisto pseudo-alignment rate, the preliminary quantification. Bottom: Salmon mapping rate in alignment mode. Both quantifications agree (Spearman 0.98 on TPM).'])
          ])
        ])
      ]),
      el('p', { class: 'qc-foot' }, ['One-page summary of the MultiQC report. The workflow handles one FASTQ pair per invocation; aggregating several samples into one count matrix is a separate step. Demo data, not a real run.'])
    ]);
  }

  function renderQcReport() {
    var wf = WORKFLOWS[state.scenario] || {};
    var kit = currentKit() || {};
    var inst = INSTRUMENTS[state.instrument] || {};
    var dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
    var expectCells = fieldValue(fieldById('expect_cells'));

    var cols = ['Sample', 'Estimated cells', 'Reads', 'Mean reads / cell', 'Median genes / cell', 'Median UMI / cell', 'Valid barcodes', 'Q30 bases (RNA read)', 'Conf. mapped to transcriptome', 'Reads in cells', 'Saturation', 'pctMT'];
    var thead = el('tr', null, cols.map(function(h){ return el('th', null, [h]); }));
    var tbody = el('tbody');
    QC_SAMPLES.forEach(function(s){
      tbody.appendChild(el('tr', null, [
        el('td', null, [el('span', { class: 'qc-flag ' + s.flag }), s.id]),
        el('td', null, [fmtInt(s.cells)]),
        el('td', null, [fmtM(s.reads)]),
        el('td', null, [fmtInt(Math.round(s.reads * 1e6 / s.cells))]),
        el('td', null, [fmtInt(s.medGenes)]),
        el('td', null, [fmtInt(s.medUMI)]),
        el('td', null, [s.validBc.toFixed(1) + '%']),
        el('td', null, [s.q30.toFixed(1) + '%']),
        el('td', null, [s.transcriptome.toFixed(1) + '%']),
        el('td', null, [s.inCells.toFixed(1) + '%']),
        el('td', null, [Math.round(s.sat * 100) + '%']),
        el('td', null, [s.mt.toFixed(1) + '%'])
      ]));
    });

    var legend = el('div', { class: 'qc-legend' }, QC_SAMPLES.map(function(s, i){
      var sp = el('span', null, [s.id]); sp.style.setProperty('--lg', QC_COLORS[i]); return sp;
    }));

    return el('div', { class: 'qc-report' }, [
      el('div', { class: 'qc-head' }, [
        el('div', null, [
          el('h3', null, ['Count QC report']),
          el('p', null, [dateStr + ' · ' + wfLabel(wf) + ' · cellranger_mapping · ' + (kit.name || '') + ' · ' + (inst.name || '')])
        ]),
        el('span', { class: 'qc-verdict' }, ['✓ 3 samples · 2 pass · 1 warning'])
      ]),
      el('div', { class: 'qc-section' }, [
        el('h4', null, ['1 · CellRanger metrics summary']),
        el('div', { class: 'qc-table-wrap' }, [el('table', { class: 'qc-table' }, [el('thead', null, [thead]), tbody])]),
        el('p', { class: 'qc-cap', style: 'font-size:12px;color:var(--text-soft);margin:8px 0 0' }, [
          'Expected cells per sample was set to ' + expectCells + '. Amber flag: foo/bar/VH02001612 recovers fewer cells, has only 78.6% of reads in cells (CellRanger warns below 70%) and a median pctMT of 11.9%, which points to ambient RNA and stressed or dying cells. Apply a stricter mitochondrial filter downstream and check the loading for that sample.'])
      ]),
      el('div', { class: 'qc-section' }, [
        el('h4', null, ['2 · Mapping and cell calling']),
        el('div', { class: 'qc-grid' }, [
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['Where the reads map']),
            qcMappingChart(),
            el('p', { class: 'qc-cap' }, ['Confidently mapped to transcriptome (purple), intronic (teal), intergenic (amber), other genome (dark grey), unmapped (light grey). Label: transcriptome share.'])
          ]),
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['Barcode rank plot']),
            qcBarcodeRankChart(),
            el('p', { class: 'qc-cap' }, ['UMI counts per barcode, ranked (log-log). The knee marks the cell calling cut-off. A soft knee, as in the third sample, means more ambient background.'])
          ]),
          el('div', { class: 'qc-panel' }, [
            el('h5', null, ['Sequencing saturation']),
            qcSaturationChart(),
            el('p', { class: 'qc-cap' }, ['Saturation against subsampled reads. Dashed line: 50%. At ' + fmtInt(Math.round(QC_SAMPLES[0].reads * 1e6 / QC_SAMPLES[0].cells)) + ' mean reads per cell the first sample is at 62%; more depth would still add new UMIs.'])
          ])
        ]),
        legend
      ]),
      el('div', { class: 'qc-section qc-out' }, [
        el('h4', null, ['3 · Output']),
        el('p', { class: 'prose', style: 'font-size:13.5px' }, ['One filtered feature-barcode matrix per sample, delivered as h5mu with these metrics in the .uns slot, plus the raw CellRanger output folders. The Counts scenario stops here: no clustering, no t-SNE or UMAP, no cell type annotation. Those are OpenPipelines processing and downstream steps.'])
        ,
        el('p', { class: 'qc-foot' }, ['One-page summary. The full output adds the CellRanger web summary per sample and the per-cell QC metrics (total counts, genes detected, pctMT) computed on the h5mu. Demo data, not a real run.'])
      ])
    ]);
  }

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------
  function renderStep(i) {
    if (i === 0) return renderStep1();
    if (i === 1) return renderStep2();
    if (i === 2) return renderStep3();
    if (i === 3) return renderStep4();
    if (i === 4) return renderStep5();
    if (i === REVIEW_IDX) return renderStep6();
    if (i === SIM_IDX)    return renderSimulate();
    var step = stepAt(i);
    if (!step) return null;
    if (step.id === 'backend')  return renderBackend();
    if (step.prereq)            return renderPrereq(step);
    if (step.id === 'download') return renderDownload();
    if (step.id === 'install')  return renderInstall();
    if (step.id === 'where')    return renderWhere();
    if (step.id === 'locations') return renderLocations();
    if (step.id === 'run')      return renderRun();
    if (step.id === 'report')   return renderReport();
    if (step.id === 'next')     return renderNext();
    return null;
  }

  function render() {
    var root = document.getElementById('contentRoot');
    root.innerHTML = '';
    // Stop any animation from a step that is no longer shown
    var current = stepAt(state.activeStep) || {};
    if (current.id !== 'install' && installTimer) { clearInterval(installTimer); installTimer = null; }
    if (current.id !== 'run' && runTimer) { clearInterval(runTimer); runTimer = null; }

    var steps = allSteps();
    if (state.activeStep > REVIEW_IDX) root.appendChild(selectionCard());
    for (var i = 0; i < state.activeStep; i++) {
      if (!stepCompleteness(i)) continue;
      // Past the review, only collapse the path's own steps; the six base
      // steps are summarised in the rail.
      if (state.activeStep > REVIEW_IDX && i <= REVIEW_IDX) continue;
      var eyebrow = 'Step ' + (i + 1) + ' \u00B7 ' + steps[i].label;
      var value = stepSummary(i) || '\u2014';
      root.appendChild(collapsedCard(i, eyebrow, value));
    }

    var stepNode = renderStep(state.activeStep);
    var cur = stepAt(state.activeStep) || {};
    var framed = state.path === 'enduser' && ['where', 'locations', 'run', 'report'].indexOf(cur.id) >= 0;
    if (stepNode && framed) {
      stepNode = appFrame(stepNode);
    }
    // From the install step on, the step is pinned to the viewport instead of
    // the page growing and scrolling.
    var pinned = framed || (state.path === 'enduser' && cur.id === 'install');
    document.body.classList.toggle('is-pinned', !!pinned);
    if (stepNode) root.appendChild(stepNode);
    renderProgress();
  }

  // ---- Embed + theme handshake ----
  var params = new URLSearchParams(window.location.search);
  if (params.get('embed') === '1') document.body.classList.add('is-embedded');
  function applyTheme(value) {
    // A host page may pin a theme; otherwise the operating system decides.
    document.documentElement.setAttribute('data-theme', value === 'dark' ? 'dark' : 'light');
  }
  if (params.get('theme') === 'dark') applyTheme('dark');
  else if (params.get('theme') === 'light') applyTheme('light');
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'di-demo-theme') applyTheme(e.data.value);
  });

  document.getElementById('restartBtn').addEventListener('click', reset);

  render();
})();
</script>
