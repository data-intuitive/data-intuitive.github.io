<script>
(function(){
  'use strict';

  // ---------------------------------------------------------------------
  // Steps — order follows the Skaldu wizard: scenario precedes experiment.
  // ---------------------------------------------------------------------
  var STEPS = [
    { id: 'entry',      label: 'Entry point' },
    { id: 'kit',        label: 'Kit' },
    { id: 'instrument', label: 'Instrument' },
    { id: 'scenario',   label: 'Scenario' },
    { id: 'experiment', label: 'Experiment' },
    { id: 'review',     label: 'Review' }
  ];

  // ---- Entry points, grouped by domain -------------------------------
  var ENTRY_POINTS = [
    { id: 'single_cell', group: 'Transcriptomics', name: 'Single-cell',  desc: 'Single-cell sequencing assays' },
    { id: 'bulk_rna',    group: 'Transcriptomics', name: 'Bulk RNA-seq', desc: 'Standard bulk RNA library prep' }
  ];
  var ENTRY_GROUPS = ['Transcriptomics'];

  // ---- Instruments ----------------------------------------------------
  var INSTRUMENTS = {
    illumina_novaseq_x:    { id: 'illumina_novaseq_x',    name: 'NovaSeq X / X Plus', vendor: 'Illumina',            throughput: 'very high', bars: '\u25B0\u25B0\u25B0\u25B0' },
    illumina_nextseq_2000: { id: 'illumina_nextseq_2000', name: 'NextSeq 1000/2000',  vendor: 'Illumina',            throughput: 'medium',    bars: '\u25B0\u25B0\u25B1\u25B1' },
    element_aviti:         { id: 'element_aviti',         name: 'AVITI / AVITI24',    vendor: 'Element Biosciences', throughput: 'medium',    bars: '\u25B0\u25B0\u25B1\u25B1' }
  };

  // ---- Kit catalogue, per entry point --------------------------------
  var KITS = {
    'single_cell': [
      { id: 'tenx_3prime_gex', name: "Chromium Single Cell 3' Gene Expression", vendor: '10x Genomics', family: 'gex',

  // ---- Scenarios follow the assay a pipeline declares, which in practice
  // ---- resolves through the kit family. Families absent here render
  // ---- "No scenarios available for this assay."
  var SC_COUNTS = [
    { id: 'transcriptomics.single_cell.count_only', name: 'Counts',

  var WORKFLOWS = {
    'transcriptomics.single_cell.count_only': { id: 'vsh/openpipeline', desc: 'OpenPipeline single-cell RNA-seq workflow.' },
    'transcriptomics.bulk.count_only':        { id: 'vsh/rnaseq',       desc: 'Bulk RNA-seq workflow (STAR + Salmon).' }

  // ---- Step 5 field declarations --------------------------------------
  var SPECIES = [

  ];

  var FIELDS = [
    { id: 'species', label: 'Species', type: 'select', options: SPECIES, def: 'human' },
    { id: 'input_shape', label: 'What do you have?', type: 'select', options: INPUT_SHAPES, def: 'run_folder',
      help: 'Decides whether demultiplexing runs, and what the input path means.' },
    { id: 'reference_mode', label: 'Reference', type: 'select', options: REFERENCE_MODES, def: 'provided' },
    { id: 'reference_path', label: 'Path to your reference', type: 'file', def: '', placeholder: '/path/to/reference',
      help: 'Prebuilt Cell Ranger reference.', showWhen: function(s){ return s.reference_mode === 'own'; } },
    { id: 'genome_fasta', label: 'Genome FASTA', type: 'file', def: '', placeholder: '/path/to/genome.fa',

    { id: 'transcriptome_gtf', label: 'Transcript annotation (GTF)', type: 'file', def: '', placeholder: '/path/to/genes.gtf',
      help: 'Transcript annotation GTF, when building a reference.', showWhen: function(s){ return s.reference_mode === 'generate'; } },
    { id: 'reference_version', label: 'Reference version label', type: 'string', def: '', placeholder: '2024-A',
      help: 'Version label recorded in a generated reference.', showWhen: function(s){ return s.reference_mode === 'generate'; } },
    { id: 'expect_cells', label: 'Cells expected per sample', type: 'integer', def: 3000,
      help: 'A recovery target for Cell Ranger, not a hard cap.' }
  ];

  // Extra fields contributed by the selected kit, keyed on kit family.
  var EXTRA_FIELDS = {
    vdj: [
      { id: 'chain_type', label: 'Chain type', type: 'select', def: 'tcr', options: [
        { id: 'tcr',  name: 'TCR (T cells)' },

      ] },

        note: 'Requires a libraries CSV mapping FASTQs to library types (GEX vs VDJ-T vs VDJ-B).' }
    ],
    multiome: [
      { id: 'libraries_csv', label: 'Libraries CSV', type: 'note',
        note: 'Requires a libraries CSV mapping FASTQs to library types (GEX vs ATAC).' }
    ],
    citeseq: [
      { id: 'antibody_csv', label: 'Antibody panel', type: 'select', def: 'totalseq_c', options: [
        { id: 'totalseq_c', name: "TotalSeq-C (10x 5')" },
        { id: 'custom',     name: 'Custom (upload CSV)' }
      ] },
      { id: 'libraries_csv', label: 'Libraries CSV', type: 'note',
        note: 'Requires a libraries CSV mapping FASTQs to library types (GEX vs ADT).' }
    ],
    flex: [
      { id: 'probe_set', label: 'Probe set', type: 'select', def: 'human_wt', options: [
        { id: 'human_wt', name: 'Human Whole Transcriptome' },
        { id: 'mouse_wt', name: 'Mouse Whole Transcriptome' },
        { id: 'custom',   name: 'Custom (upload CSV)' }
      ] },
      { id: 'multiplex_csv', label: 'Multiplexed samples?', type: 'select', def: 'no', options: [
        { id: 'no',  name: 'No' },
        { id: 'yes', name: 'Yes' }

  // ---------------------------------------------------------------------
  // Lookups
  // ---------------------------------------------------------------------
  function entryById(id) { return ENTRY_POINTS.find(function(e){ return e.id === id; }); }
  function findIn(arr, id) { return (arr || []).find(function(x){ return x.id === id; }); }
  function kitsFor(entryId) { return KITS[entryId] || []; }
  function kitById(entryId, kitId) { return findIn(kitsFor(entryId), kitId); }
  function instrumentsFor(kit) {
    return (kit && kit.instruments ? kit.instruments : []).map(function(i){ return INSTRUMENTS[i]; }).filter(Boolean);
  }
  function scenariosFor(kit) {
    if (!kit) return [];
    return SCENARIOS_BY_FAMILY[kit.family] || [];
  }
  function extraFieldsFor(kit) { return (kit && EXTRA_FIELDS[kit.family]) || []; }
  function visibleFields(kit) {
    var all = FIELDS.concat(extraFieldsFor(kit));
    return all.filter(function(f){ return !f.showWhen || f.showWhen(state.exp); });
  }
  function optLabel(list, id) { var o = findIn(list, id); return o ? o.name : '\u2014'; }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  function defaultExp() {
    var exp = {};
    FIELDS.forEach(function(f){ if (f.type !== 'note') exp[f.id] = f.def; });
    Object.keys(EXTRA_FIELDS).forEach(function(fam){
      EXTRA_FIELDS[fam].forEach(function(f){ if (f.type !== 'note' && !(f.id in exp)) exp[f.id] = f.def; });
    });
    return exp;
  }
  function defaults() {
    return {
      entry: null, kit: null, instrument: null, scenario: null,
      exp: defaultExp(), activeStep: 0
    };
  }
  var state = defaults();

  function reset() {
    state = defaults();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------------------------------------------------------------------
  // Step completeness
  // ---------------------------------------------------------------------
  function currentKit() { return kitById(state.entry, state.kit); }
  function scenarioStepSatisfied() {
    var kit = currentKit();
    if (!kit) return false;
    var list = scenariosFor(kit);
    if (!list.length) return true;      // nothing to declare — the step passes through
    return !!state.scenario;
  }
  // In this mockup nothing on step 5 is blocking: paths, version labels and
  // cell counts may be left empty. The review then falls back to the
  // placeholder each field shows.
  function experimentStepSatisfied() {
    return !!currentKit();
  }
  // What a field resolves to on the review screen when it was left empty.
  function fieldValue(f) {
    var v = state.exp[f.id];
    if (v === undefined || v === null || String(v).trim() === '') {
      return f.placeholder || (f.def !== undefined && f.def !== '' ? String(f.def) : '\u2014');
    }
    return String(v);
  }
  function fieldById(id) {
    return FIELDS.concat(EXTRA_FIELDS.vdj, EXTRA_FIELDS.multiome, EXTRA_FIELDS.citeseq, EXTRA_FIELDS.flex)
      .find(function(f){ return f.id === id; });
  }
  function stepCompleteness(i) {
    if (i === 0) return !!state.entry;
    if (i === 1) return !!state.kit;
    if (i === 2) return !!state.instrument;
    if (i === 3) return scenarioStepSatisfied();
    if (i === 4) return experimentStepSatisfied();
    return false;
  }
  function maxReachableStep() {
    for (var i = 0; i < STEPS.length; i++) {
      if (!stepCompleteness(i)) return i;
    }
    return STEPS.length - 1;
  }
  function setActiveStep(i) {
    var max = maxReachableStep();
    if (i > max) return;
    state.activeStep = i;
    render();
    // Bring the newly-active step into view inside the iframe / page
    setTimeout(function(){
      var content = document.getElementById('contentRoot');
      if (!content) return;
      var active = content.querySelector('.step-card:not(.is-collapsed), .review-card');
      if (active && typeof active.scrollIntoView === 'function') {
        active.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, 30);
  }

  // ---------------------------------------------------------------------
  // DOM helpers
  // ---------------------------------------------------------------------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }
  function arrow(size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('width', size || '14'); s.setAttribute('height', size || '14');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2');
    s.innerHTML = '<path d="M5 12h14M13 5l7 7-7 7"/>';
    return s;
  }

  // ---------------------------------------------------------------------
  // Progress rail
  // ---------------------------------------------------------------------
  function renderProgress() {
    var list = document.getElementById('progressList');
    list.innerHTML = '';
    var max = maxReachableStep();
    STEPS.forEach(function(step, i){
      var li = document.createElement('li');
      li.className = 'demo-progress-step';
      if (i === state.activeStep) li.classList.add('is-active');
      if (stepCompleteness(i) && i < state.activeStep) li.classList.add('is-complete');
      if (i > max) li.classList.add('is-future');

      var summary = stepSummary(i);
      if (i >= state.activeStep && i !== 5) summary = (i === state.activeStep ? summary : '');

      li.appendChild(el('div', { class: 'demo-step-num' }, [String(i + 1)]));
      li.appendChild(el('div', { class: 'demo-step-text' }, [
        el('span', { class: 'demo-step-label' }, [step.label]),
        summary ? el('span', { class: 'demo-step-summary' }, [summary]) : null
      ]));
      li.addEventListener('click', function(){
        if (i <= max) setActiveStep(i);
      });
      list.appendChild(li);
    });
  }

  function stepSummary(i) {
    var kit = currentKit();
    if (i === 0 && state.entry) return entryById(state.entry).name;
    if (i === 1 && kit) return kit.name;
    if (i === 2 && state.instrument) return (INSTRUMENTS[state.instrument] || {}).name || '';
    if (i === 3 && kit) {
      if (!scenariosFor(kit).length) return 'No scenarios for this assay';
      return state.scenario ? (findIn(scenariosFor(kit), state.scenario) || {}).name || '' : '';
    }
    if (i === 4 && kit && experimentStepSatisfied()) {
      return optLabel(SPECIES, state.exp.species) + ' \u00B7 ' + optLabel(INPUT_SHAPES, state.exp.input_shape);
    }
    if (i === 5 && stepCompleteness(4)) {
      var wf = WORKFLOWS[state.scenario];
      return wf ? wf.id : (kit ? (kit.software || '') : '');
    }
    return '';
  }

  function collapsedCard(stepIndex, eyebrow, value) {
    var card = el('div', { class: 'step-card is-collapsed' }, [
      el('div', { class: 'step-card-head' }, [
        el('div', null, [
          el('span', { class: 'step-card-eyebrow' }, [eyebrow]),
          el('div', null, [
            el('span', { class: 'step-card-title' }, [value])
          ])
        ]),
        el('span', { class: 'step-card-edit' }, ['Edit'])
      ])
    ]);
    card.addEventListener('click', function(){ setActiveStep(stepIndex); });
    return card;
  }

  // ---------------------------------------------------------------------
  // Step 1 · Entry point
  // ---------------------------------------------------------------------
  function entryCard(ep) {
    var kitCount = kitsFor(ep.id).length;
    return el('button', {
      class: 'opt-card' + (state.entry === ep.id ? ' is-selected' : ''),
      type: 'button',
      onclick: function(){
        if (state.entry !== ep.id) {
          state.entry = ep.id;
          state.kit = null; state.instrument = null; state.scenario = null;
          state.exp = defaultExp();
        }
        setActiveStep(1);
      }
    }, [
      el('div', { class: 'opt-card-title' }, [ep.name]),
      el('p', { class: 'opt-card-desc' }, [ep.desc]),
      el('div', { class: 'opt-card-meta' }, [
        el('span', { class: 'opt-card-chip status-boarding' }, ['Boarding']),
        el('span', { class: 'opt-card-chip gray' }, [kitCount + ' kit' + (kitCount === 1 ? '' : 's')])
      ])
    ]);
  }

  function renderStep1() {
    var card = el('div', { class: 'step-card' }, [
      el('span', { class: 'step-card-eyebrow' }, ['Step 1 \u00B7 Entry point']),
      el('h2', { class: 'step-card-title' }, ['What are you measuring?']),
      el('p', { class: 'step-card-intro' }, ['Pick an entry point. The wizard then surfaces only the kits, instruments and scenarios that have verified pipeline support.'])
    ]);

    ENTRY_GROUPS.forEach(function(group){
      var eps = ENTRY_POINTS.filter(function(e){ return e.group === group; });
      if (!eps.length) return;
      var grid = el('div', { class: 'opt-grid wide' });
      eps.forEach(function(ep){ grid.appendChild(entryCard(ep)); });
      card.appendChild(el('div', { class: 'ep-group' }, [
        el('h4', null, [group]),
        grid
      ]));
    });
    return card;
  }

  // ---------------------------------------------------------------------
  // Step 2 · Kit
  // ---------------------------------------------------------------------
  function renderStep2() {
    var kits = kitsFor(state.entry);
    var grid = el('div', { class: 'opt-grid wide' });

    kits.forEach(function(k){
      grid.appendChild(el('button', {
        class: 'opt-card kit-card' + (state.kit === k.id ? ' is-selected' : ''),
        type: 'button',
        onclick: function(){
          if (state.kit !== k.id) {
            state.kit = k.id;
            state.instrument = null;
            state.scenario = null;
          }
          setActiveStep(2);
        }
      }, [
        el('div', { class: 'opt-card-title' }, [k.name]),
        el('p', { class: 'opt-card-assay' }, [k.assays.join(' \u00B7 ')]),
        el('span', { class: 'opt-card-cat' }, [k.vendor]),
        el('div', { class: 'opt-card-meta' }, [
          k.software ? el('span', { class: 'opt-card-chip' }, [k.software]) : null
        ])
      ]));
    });

    return el('div', { class: 'step-card' }, [
      el('span', { class: 'step-card-eyebrow' }, ['Step 2 \u00B7 Kit']),
      el('h2', { class: 'step-card-title' }, ['Choose a kit']),
      el('p', { class: 'step-card-intro' }, ['Library prep chemistry. The kit fixes the assay, and with it the instrument list, the scenarios and the kit-specific fields further on.']),
      grid
    ]);
  }

  // ---------------------------------------------------------------------
  // Step 3 · Instrument
  // ---------------------------------------------------------------------
  function renderStep3() {
    var kit = currentKit();
    var insts = instrumentsFor(kit);
    var grid = el('div', { class: 'opt-grid wide' });

    insts.forEach(function(inst){
      var thrClass = inst.throughput === 'very high' ? 'opt-card-chip amber' : 'opt-card-chip gray';
      grid.appendChild(el('button', {
        class: 'opt-card' + (state.instrument === inst.id ? ' is-selected' : ''),
        type: 'button',
        onclick: function(){
          state.instrument = inst.id;
          setActiveStep(3);
        }
      }, [

    ]);

  // ---------------------------------------------------------------------
  // Step 4 · Scenario
  // ---------------------------------------------------------------------
  function renderStep4() {
    var kit = currentKit();
    var scenarios = scenariosFor(kit);
    var card = el('div', { class: 'step-card' }, [
      el('span', { class: 'step-card-eyebrow' }, ['Step 4 \u00B7 Scenario']),
      el('h2', { class: 'step-card-title' }, ['Choose a scenario']),
      el('p', { class: 'step-card-intro' }, ['How deep should the analysis go? Scenarios are declared per assay, so they follow the kit you picked.'])
    ]);

    if (!scenarios.length) {
      card.appendChild(el('p', { class: 'step-empty' }, ['No scenarios available for this assay.']));
      card.appendChild(el('div', { class: 'step-action' }, [
        el('button', {
          class: 'btn-primary', type: 'button',
          onclick: function(){ state.scenario = null; setActiveStep(4); }
        }, ['Describe the experiment', arrow()])
      ]));

    scenarios.forEach(function(sc){
      grid.appendChild(el('button', {
        class: 'opt-card scenario-card' + (state.scenario === sc.id ? ' is-selected' : ''),
        type: 'button',
        onclick: function(){ state.scenario = sc.id; setActiveStep(4); }
      }, [
        el('div', { class: 'opt-card-title' }, [sc.name]),

        el('div', { class: 'opt-card-meta' }, [
          el('span', { class: 'opt-card-chip teal' }, [sc.id])
        ])
      ]));
    });
    card.appendChild(grid);
    return card;
  }

  // ---------------------------------------------------------------------
  // Step 5 · Experiment
  // ---------------------------------------------------------------------
  function fieldNode(f, onDirty) {
    if (f.type === 'note') {
      return el('div', { class: 'field-note' }, [
        el('span', null, [el('b', null, [f.label + ': ']), f.note])
      ]);
    }

    var input;
    if (f.type === 'select') {
      input = el('select', { id: 'f-' + f.id });
      f.options.forEach(function(o){
        var opt = el('option', { value: o.id }, [o.name]);
        if (state.exp[f.id] === o.id) opt.selected = true;
        input.appendChild(opt);
      });
      input.addEventListener('change', function(){
        state.exp[f.id] = input.value;
        render();                       // reference_mode toggles other fields
      });
    } else {
      input = el('input', {
        id: 'f-' + f.id,
        type: f.type === 'integer' ? 'number' : 'text',
        value: state.exp[f.id] == null ? '' : String(state.exp[f.id])
      });
      if (f.type === 'integer') input.setAttribute('min', '1');
      if (f.placeholder) input.setAttribute('placeholder', f.placeholder);
      input.addEventListener('input', function(){
        if (f.type === 'integer') {
          state.exp[f.id] = input.value === '' ? '' : Number(input.value);
        } else {
          state.exp[f.id] = input.value;
        }
        onDirty();
      });
    }

    return el('div', { class: 'field' }, [
      el('label', { for: 'f-' + f.id }, [f.label]),
      input,
      f.help ? el('span', { class: 'field-help' }, [f.help]) : null
    ]);
  }

  function renderStep5() {
    var kit = currentKit();
    var nextBtn = el('button', {
      class: 'btn-primary', type: 'button',
      onclick: function(){ setActiveStep(5); }
    }, ['Review', arrow()]);
    function refreshValidity() { /* nothing on this step blocks the mockup */ }

    var grid = el('div', { class: 'field-grid' });
    FIELDS.forEach(function(f){
      if (f.showWhen && !f.showWhen(state.exp)) return;
      grid.appendChild(fieldNode(f, refreshValidity));
    });

    var extras = extraFieldsFor(kit);
    if (extras.length) {
      grid.appendChild(el('div', { class: 'field-section-title' }, [kit.vendor + ' \u00B7 kit-specific fields']));
      extras.forEach(function(f){ grid.appendChild(fieldNode(f, refreshValidity)); });
    }

    var card = el('div', { class: 'step-card' }, [
      el('span', { class: 'step-card-eyebrow' }, ['Step 5 \u00B7 Experiment']),
      el('h2', { class: 'step-card-title' }, ['Describe the experiment']),
      el('p', { class: 'step-card-intro' }, ['Species, inputs and reference. Defaults are pre-filled; adjust them to your run.']),
      grid,
      el('div', { class: 'step-action' }, [nextBtn])
    ]);
    refreshValidity();
    return card;
  }

  function prefersDark() {
    var pinned = document.documentElement.getAttribute('data-theme');
    if (pinned === 'dark') return true;
    if (pinned === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  // ---------------------------------------------------------------------
  // Step 6 · Review
  // ---------------------------------------------------------------------
  function experimentSummaryLines() {
    var kit = currentKit();
    var lines = [
      'Species: ' + optLabel(SPECIES, state.exp.species),
      'Input: ' + optLabel(INPUT_SHAPES, state.exp.input_shape),
      'Reference: ' + optLabel(REFERENCE_MODES, state.exp.reference_mode)
    ];
    if (state.exp.reference_mode === 'own') {
      lines.push('Reference path: ' + fieldValue(fieldById('reference_path')));
    }
    if (state.exp.reference_mode === 'generate') {
      lines.push('Genome FASTA: ' + fieldValue(fieldById('genome_fasta')));
      lines.push('GTF: ' + fieldValue(fieldById('transcriptome_gtf')));
      lines.push('Reference version: ' + fieldValue(fieldById('reference_version')));
    }
    lines.push('Cells expected per sample: ' + fieldValue(fieldById('expect_cells')));
    extraFieldsFor(kit).forEach(function(f){
      if (f.type === 'note') lines.push(f.label + ': required');
      else lines.push(f.label + ': ' + optLabel(f.options, state.exp[f.id]));
    });
    return lines;
  }

  function renderStep6() {
    var entry      = entryById(state.entry);
    var kit        = currentKit();
    var instrument = INSTRUMENTS[state.instrument];
    var scenario   = findIn(scenariosFor(kit), state.scenario);
    var workflow   = WORKFLOWS[state.scenario];

    var config = {
      entry: state.entry, kit: state.kit, instrument: state.instrument,
      scenario: state.scenario, experiment: state.exp,
      workflowId: workflow && workflow.id
    };

    function saveAndGo() {
      return function(){
        try { sessionStorage.setItem('di-demo-config', JSON.stringify(config)); } catch(_){}
      };
    }
    var embedSuffix = (params.get('embed') === '1' ? '?embed=1' : '?')
      + (params.get('embed') === '1' ? '&' : '')
      + 'theme=' + encodeURIComponent(prefersDark() ? 'dark' : 'light');

    var contactBtn = el('a', {
      class: 'review-cta-btn is-primary',
      href: '/demo/contact.html' + embedSuffix,
      onclick: saveAndGo()
    }, ['Contact us', arrow('16')]);

    var bookingBtn = el('a', {
      class: 'review-cta-btn is-secondary',
      href: '/demo/bookmeeting.html' + embedSuffix,
      onclick: saveAndGo()
    }, ['Book a meeting', arrow('16')]);

    var expBlock = el('div', null, [
      el('div', { class: 'review-label' }, ['Experiment']),
      el('div', { class: 'review-value' }, [optLabel(SPECIES, state.exp.species)])
    ]);
    experimentSummaryLines().slice(1).forEach(function(line){
      expBlock.appendChild(el('p', { class: 'review-desc' }, [line]));
    });

    return el('div', { class: 'review-card' }, [
      el('div', { class: 'review-badges' }, [
        el('span', { class: 'review-badge coverage' }, [scenario ? 'Full coverage' : 'No scenario declared'])
      ]),
      el('div', { class: 'review-row' }, [
        el('div', null, [
          el('div', { class: 'review-label' }, ['Entry point']),
          el('div', { class: 'review-value' }, [entry.name]),
          el('p', { class: 'review-desc' }, [entry.desc])
        ]),
        el('div', null, [
          el('div', { class: 'review-label' }, ['Kit']),
          el('div', { class: 'review-value' }, [kit.name]),
          el('p', { class: 'review-desc' }, [kit.vendor + ' \u00B7 ' + kit.assays.join(' \u00B7 ')]),
          el('div', { class: 'review-chip-row' }, [
            el('span', { class: 'opt-card-chip gray' }, ['family: ' + kit.family]),
            kit.software ? el('span', { class: 'opt-card-chip' }, [kit.software]) : null
          ])
        ])
      ]),
      el('div', { class: 'review-row' }, [
        el('div', null, [
          el('div', { class: 'review-label' }, ['Instrument']),
          el('div', { class: 'review-value' }, [instrument.name]),
          el('p', { class: 'review-desc' }, [instrument.vendor + ' \u00B7 ' + instrument.throughput + ' throughput'])
        ]),
        el('div', null, [
          el('div', { class: 'review-label' }, ['Scenario']),
          el('div', { class: 'review-value' }, [scenario ? scenario.name : '\u2014']),
          el('p', { class: 'review-desc' }, [scenario ? scenario.desc : 'No scenarios available for this assay.']),
          scenario ? el('div', { class: 'review-chip-row' }, [
            el('span', { class: 'opt-card-chip teal' }, [scenario.id])
          ]) : null
        ])
      ]),
      el('div', { class: 'review-row' }, [
        expBlock,
        el('div', null, [
          el('div', { class: 'review-label' }, ['Resolved workflow']),
          el('div', { class: 'review-workflow-id' }, [workflow ? workflow.id : 'not resolved']),
          el('p', { class: 'review-desc' }, [workflow ? workflow.desc : 'A pipeline has not been declared for this assay yet.'])
        ])
      ]),
      el('p', { class: 'review-callout' }, [
        'With this information we deliver you the omics workflow you need, ',
        el('em', null, ['based on your choices']),
        '. Contact us for more information or to get going.'
      ]),
      el('div', { class: 'review-cta-row' }, [contactBtn, bookingBtn])
    ]);
  }

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------
  function renderStep(i) {
    if (i === 0) return renderStep1();
    if (i === 1) return renderStep2();
    if (i === 2) return renderStep3();
    if (i === 3) return renderStep4();
    if (i === 4) return renderStep5();
    if (i === 5) return renderStep6();
  }

  function render() {
    var root = document.getElementById('contentRoot');
    root.innerHTML = '';

    for (var i = 0; i < state.activeStep; i++) {
      if (!stepCompleteness(i)) continue;
      var eyebrow = 'Step ' + (i + 1) + ' \u00B7 ' + STEPS[i].label;
      var value = stepSummary(i) || '\u2014';
      root.appendChild(collapsedCard(i, eyebrow, value));
    }

    var stepNode = renderStep(state.activeStep);
    if (stepNode) root.appendChild(stepNode);
    renderProgress();
  }

  // ---- Embed + theme handshake ----
  var params = new URLSearchParams(window.location.search);
  if (params.get('embed') === '1') document.body.classList.add('is-embedded');
  function applyTheme(value) {
    // A host page may pin a theme; otherwise the operating system decides.
    document.documentElement.setAttribute('data-theme', value === 'dark' ? 'dark' : 'light');
  }
  if (params.get('theme') === 'dark') applyTheme('dark');
  else if (params.get('theme') === 'light') applyTheme('light');
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'di-demo-theme') applyTheme(e.data.value);
  });

  document.getElementById('restartBtn').addEventListener('click', reset);

  render();
})();
</script>

</body>
</html>
